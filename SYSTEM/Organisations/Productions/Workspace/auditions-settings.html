<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Audition Settings - Build The Show</title></head>
<body>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var id = p.get('id') || '';
    var path = location.pathname.replace(/\/tools\/auditions-settings(?:\.html)?\/?$/, '');
    if (!path || path === location.pathname) path = '/org/production';
    var dest = path + '/auditions/settings' + (id ? '?id=' + encodeURIComponent(id) : '');
    window.location.replace(dest);
  })();
</script>
<script type="module" src="/SHARED/Components/private-profile-media.js?v=20261116-private-routes"></script>
</body>
</html>
