<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://tkmaiktxpwqfbgeojbnf.supabase.co" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cast List - Build The Show</title>
  <link rel="stylesheet" href="/ASSETS/styles/styles.css?v=20260718c" />
  <link rel="stylesheet" href="/ASSETS/styles/production-sidebar.css?v=20260802-restricted-portal-flat-nav" />
  <style>
    * { box-sizing: border-box; }
    html { width: 100%; max-width: 100%; overflow-x: hidden; }
    body { margin: 0; width: 100%; max-width: 100%; overflow-x: hidden; background: #fff; font-family: var(--bts-font); color: #000000; display: flex; flex-direction: column; min-height: 100vh; }
    body.mobile-sidebar-open { overflow: hidden; }
    .prod-main { margin-left: 220px; flex: 1; min-height: 100vh; padding: 2rem 2.25rem; max-width: calc(100vw - 220px); overflow-x: clip; position: relative;  z-index: 0; }
    .prod-main::before { content: ''; position: fixed; inset: 0 0 0 220px; background-image: url('/ASSETS/Images/Decrotive/Grid-purple.png'); background-repeat: repeat; background-size: 720px; opacity: 0.04; pointer-events: none; z-index: -1; }
    .prod-main-inner { position: relative; z-index: 1; max-width: 1100px; }
    @media (max-width: 900px) {
      .prod-main { margin-left: 0; max-width: 100vw; width: 100%; padding: 4.5rem 1rem 2rem; }
      .prod-main::before { inset: 0; }
    }

    .page-kicker { font-size: 0.72rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(0,0,0,0.38); display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
    .page-kicker-dot { width: 6px; height: 6px; border-radius: 50%; background: #572e88; flex-shrink: 0; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .page-title { font-size: 2rem; font-weight: 900; color: #000000; margin: 0; }
    .page-subtitle { font-size: 0.85rem; color: rgba(0,0,0,0.45); margin: 0.25rem 0 0; }
    .page-actions { display: flex; gap: 0.5rem; align-items: flex-start; flex-shrink: 0; }
    .btn-export { font-size: 0.8rem; font-weight: 900; border-radius: 8px; padding: 0.48rem 1rem; border: 1.5px solid rgba(87,46,136,0.22); background: #fff; color: #572e88; cursor: pointer; font-family: var(--bts-font); transition: all 0.12s; }
    .btn-export:hover { background: #f0ecfc; }

    /* View toggle */
    .view-toggle { display: flex; gap: 0; border: 1.5px solid rgba(87,46,136,0.15); border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem; display: inline-flex; }
    .view-btn { font-size: 0.78rem; font-weight: 900; padding: 0.4rem 0.9rem; border: none; background: #fff; color: rgba(0,0,0,0.55); cursor: pointer; font-family: var(--bts-font); transition: all 0.12s; border-right: 1px solid rgba(87,46,136,0.12); }
    .view-btn:last-child { border-right: none; }
    .view-btn.active { background: #572e88; color: #fff; }

    /* Programme view */
    .cl-programme-card { background: #fff; border: 1.5px solid rgba(87,46,136,0.12); border-radius: 14px; padding: 2.5rem 3rem; max-width: 640px; }
    .cl-programme-title { font-size: 1.6rem; font-weight: 900; text-align: center; margin-bottom: 2rem; color: #000000; }
    .cl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.5rem; padding: 0.25rem 0; border-bottom: 1px solid rgba(87,46,136,0.06); }
    .cl-row:last-child { border-bottom: none; }
    .cl-role { font-size: 0.85rem; font-weight: 900; color: #000000; }
    .cl-name { font-size: 0.85rem; color: rgba(0,0,0,0.7); }
    .cl-name.open { color: rgba(0,0,0,0.3); font-style: italic; }
    .cl-name.pending { color: #dd8233; font-style: italic; }

    /* Table view */
    .cl-table { width: 100%; border-collapse: collapse; }
    .cl-table th { font-size: 0.68rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(0,0,0,0.4); padding: 0.6rem 0.9rem; border-bottom: 1.5px solid rgba(87,46,136,0.1); text-align: left; }
    .cl-table td { padding: 0.75rem 0.9rem; border-bottom: 1px solid rgba(87,46,136,0.06); vertical-align: middle; }
    .cl-table tbody tr:hover { background: rgba(87,46,136,0.02); }
    .cl-char-name { font-size: 0.88rem; font-weight: 900; }
    .cl-perf-list { display: flex; flex-direction: column; gap: 0.2rem; }
    .cl-perf-name { font-size: 0.84rem; }
    .cl-perf-name.open { color: rgba(0,0,0,0.3); font-style: italic; }
    .cl-perf-name.pending { color: #dd8233; font-style: italic; }
    .cl-role-type { font-size: 0.68rem; font-weight: 900; border-radius: 100px; padding: 0.18rem 0.5rem; background: rgba(87,46,136,0.08); color: #572e88; }

    /* Performer cards */
    .cl-performer-photo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; flex-shrink: 0; background: #ede7fb; border: 1.5px solid rgba(87,46,136,0.08); }
    .cl-performer-photo-placeholder { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #efe7ff; color: #572e88; font-size: 0.76rem; font-weight: 900; flex-shrink: 0; border: 1.5px solid rgba(87,46,136,0.08); }
    .cl-performer-name { font-size: 0.88rem; font-weight: 800; color: #000000; line-height: 1.15; }
    .cl-performer-sub { margin-top: 0.1rem; font-size: 0.72rem; color: rgba(0,0,0,0.45); line-height: 1.3; }
    .cl-pill-row { display: flex; flex-wrap: wrap; gap: 0.38rem; margin-top: 0.65rem; }
    .cl-pill { font-size: 0.66rem; font-weight: 900; border-radius: 999px; padding: 0.2rem 0.55rem; white-space: nowrap; }
    .cl-pill.role { background: rgba(87,46,136,0.08); color: #572e88; }
    .cl-pill.good { background: rgba(118,158,123,0.16); color: #769e7b; }
    .cl-pill.warn { background: rgba(221,130,51,0.16); color: #dd8233; }
    .cl-pill.soft { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.6); }
    .cl-add-role-btn { font-size: 0.76rem; font-weight: 900; border-radius: 8px; padding: 0.42rem 0.85rem; border: 1.5px solid rgba(87,46,136,0.22); background: #fff; color: #572e88; cursor: pointer; font-family: var(--bts-font); transition: background 0.12s; white-space: nowrap; }
    .cl-add-role-btn:hover { background: #f0ecfc; }

    /* Performers table - matches Auditions > All Performers, but scoped to cast only */
    .cl-perf-toolbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.15rem; }
    .cl-perf-search { flex: 1; min-width: 200px; max-width: 340px; position: relative; }
    .cl-perf-search input { width: 100%; border: 1.5px solid rgba(87,46,136,0.18); border-radius: 8px; padding: 0.48rem 0.9rem 0.48rem 2.1rem; font-size: 0.85rem; font-family: var(--bts-font); background: #fff; color: #000000; outline: none; transition: border-color 0.12s; box-sizing: border-box; }
    .cl-perf-search input:focus { border-color: #572e88; }
    .cl-perf-search-icon { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); opacity: 0.35; pointer-events: none; }
    .cl-perf-filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .cl-perf-filter-pill { font-size: 0.72rem; font-weight: 800; border-radius: 100px; padding: 0.28rem 0.7rem; border: 1.5px solid rgba(87,46,136,0.2); background: #fff; color: rgba(0,0,0,0.6); cursor: pointer; font-family: var(--bts-font); transition: all 0.12s; }
    .cl-perf-filter-pill:hover { border-color: #572e88; color: #572e88; }
    .cl-perf-filter-pill.active { background: #572e88; color: #fff; border-color: #572e88; }
    .cl-perf-count { font-size: 0.78rem; color: rgba(0,0,0,0.4); font-weight: 700; margin-left: auto; white-space: nowrap; }
    .cl-perf-table { width: 100%; border-collapse: collapse; }
    .cl-perf-table th { font-size: 0.68rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(0,0,0,0.4); padding: 0.6rem 0.85rem; border-bottom: 1.5px solid rgba(87,46,136,0.1); text-align: left; }
    .cl-perf-table td { padding: 0.6rem 0.85rem; border-bottom: 1px solid rgba(87,46,136,0.08); vertical-align: middle; }
    .cl-perf-row { cursor: pointer; background: #ffffff; }
    .cl-perf-row.alt { background: #f7f4fc; }
    .cl-perf-row:hover { background: rgba(87,46,136,0.08); }
    .cl-perf-name-cell { display: flex; align-items: center; gap: 0.7rem; }
    .cl-add-role-card { width: min(440px, calc(100vw - 2rem)); border-radius: 22px; background: #fff; box-shadow: 0 30px 80px rgba(22, 10, 44, 0.32); border: 1px solid rgba(87,46,136,0.08); padding: 1.4rem; }
    .cl-add-role-title { font-size: 1.15rem; font-weight: 900; color: #000000; margin-bottom: 0.2rem; }
    .cl-add-role-sub { font-size: 0.8rem; color: rgba(0,0,0,0.55); margin-bottom: 1.1rem; }
    .cl-add-role-field { margin-bottom: 0.9rem; }
    .cl-add-role-label { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(87,46,136,0.6); margin-bottom: 0.3rem; }
    .cl-add-role-select { width: 100%; background: #f5f3fc; border: 1px solid rgba(87,46,136,0.2); color: #000000; border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 0.88rem; font-family: var(--bts-font); }
    .cl-add-role-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; }
    .cl-add-role-save { flex: 1; background: #572e88; color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.86rem; font-weight: 800; cursor: pointer; font-family: var(--bts-font); }
    .cl-add-role-cancel { background: #fff; color: rgba(0,0,0,0.55); border: 1.5px solid rgba(0,0,0,0.14); border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.86rem; font-weight: 800; cursor: pointer; font-family: var(--bts-font); }
    .cl-add-role-error { display: none; background: rgba(209,82,61,0.08); border: 1px solid rgba(209,82,61,0.25); border-radius: 8px; padding: 0.5rem 0.8rem; font-size: 0.8rem; color: #d1523d; margin-bottom: 0.9rem; }
    .cl-add-role-error.visible { display: block; }

    /* Performer modal */
    .cl-modal-backdrop { position: fixed; inset: 0; background: rgba(38, 22, 64, 0.56); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 1.25rem; z-index: 1000; }
    .cl-modal-backdrop.open { display: flex; }
    .cl-modal-card { width: min(1080px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto; border-radius: 26px; background: #fff; box-shadow: 0 30px 80px rgba(22, 10, 44, 0.32); border: 1px solid rgba(87,46,136,0.08); }
    .cl-modal-top { display: flex; justify-content: space-between; gap: 1rem; padding: 0.9rem 1.1rem 0.7rem; border-bottom: 1px solid rgba(87,46,136,0.08); position: sticky; top: 0; background: #fff; z-index: 2; }
    .cl-modal-top button { border: none; background: none; font-size: 1.8rem; line-height: 1; color: rgba(87,46,136,0.56); cursor: pointer; font-family: inherit; }
    .cl-modal-top button:hover { color: #572e88; }
    .cl-modal-body { padding: 1rem 1.1rem 1.2rem; }
    .cl-modal-hero { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 0.85rem; align-items: start; margin-bottom: 0.85rem; }
    .cl-modal-photo { width: 104px; aspect-ratio: 4 / 5; border-radius: 16px; object-fit: cover; object-position: top; background: #efe7ff; }
    .cl-modal-photo-placeholder { width: 104px; aspect-ratio: 4 / 5; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #efe7ff; color: #572e88; font-size: 1.6rem; font-weight: 900; }
    .cl-modal-name { font-size: 1.5rem; line-height: 1.05; font-weight: 900; color: #000000; margin: 0; }
    .cl-modal-sub { margin-top: 0.26rem; font-size: 0.8rem; color: rgba(0,0,0,0.55); line-height: 1.4; }
    .cl-modal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; }
    .cl-modal-section.full { grid-column: 1 / -1; }
    .cl-detail-list { display: grid; gap: 0.55rem; }
    .cl-detail-item { display: grid; gap: 0.14rem; }
    .cl-detail-label { font-size: 0.64rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(0,0,0,0.4); }
    .cl-detail-value { font-size: 0.83rem; color: #000000; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .cl-detail-value.soft { color: rgba(0,0,0,0.55); }

    /* ── Conflict date tiles - same picker as the applicant modal ── */
    .cl-conflict-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(5rem, 1fr)); gap: 0.6rem; margin-bottom: 0.75rem; }
    .cl-conflict-tile { font-family: var(--bts-font); cursor: pointer; padding: 0.55rem 0.55rem 0.6rem; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; background: #fff; border: 1.5px solid rgba(0,0,0,0.14); }
    .cl-conflict-tile.active { background: color-mix(in srgb, var(--tile) 8%, #fff); border: 2px solid var(--tile); }
    .cl-conflict-badge { width: 3.4rem; border: 1px solid rgba(0,0,0,0.1); border-radius: 0.85rem; overflow: hidden; background: #fff; }
    .cl-conflict-badge-month { background: #b8b8c2; color: #fff; font-size: 0.72rem; font-weight: 800; line-height: 1; padding: 0.36rem 0 0.32rem; text-align: center; letter-spacing: 0.03em; }
    .cl-conflict-tile.active .cl-conflict-badge-month { background: var(--tile); }
    .cl-conflict-badge-day { color: #000000; font-size: 1.5rem; font-weight: 900; line-height: 1; padding: 0.28rem 0 0.16rem; text-align: center; }
    .cl-conflict-weekday { font-size: 0.62rem; font-weight: 800; color: rgba(0,0,0,0.55); letter-spacing: 0.02em; }
    .cl-conflict-tile.active .cl-conflict-weekday { color: var(--tile); }
    .cl-conflict-caption { font-size: 0.52rem; font-weight: 800; color: var(--tile); letter-spacing: 0.02em; text-align: center; line-height: 1.1; }
    .cl-conflict-picker { grid-column: 1 / -1; border: 1.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 0.7rem 0.8rem; background: rgba(0,0,0,0.02); }
    .cl-conflict-picker-head { display: flex; align-items: center; justify-content: space-between; gap: 0.7rem; margin-bottom: 0.55rem; }
    .cl-conflict-picker-title { font-size: 0.8rem; font-weight: 800; color: #000000; }
    .cl-conflict-picker-date { font-size: 0.7rem; font-weight: 700; color: rgba(0,0,0,0.5); letter-spacing: 0.03em; }
    .cl-conflict-done-btn { background: #572e88; color: #fff; border: none; border-radius: 7px; padding: 0.26rem 0.65rem; font-size: 0.7rem; font-weight: 700; cursor: pointer; font-family: var(--bts-font); }
    .cl-conflict-daytype-row { display: flex; gap: 0.5rem; }
    .cl-conflict-daytype-btn { flex: 1; border: 1.5px solid rgba(0,0,0,0.16); background: #fff; color: #000000; border-radius: 8px; padding: 0.42rem 0.5rem; font-size: 0.74rem; font-weight: 700; cursor: pointer; font-family: var(--bts-font); }
    .cl-conflict-daytype-btn.active { border-color: #572e88; background: #572e88; color: #fff; }
    .cl-conflict-notes { width: 100%; box-sizing: border-box; min-height: 5.5rem; resize: vertical; border: 1.5px solid rgba(0,0,0,0.28); border-radius: 10px; padding: 0.6rem 0.7rem; font-size: 0.83rem; line-height: 1.4; color: #000000; background: #fff; font-family: var(--bts-font); outline: none; }
    .cl-conflict-notes:focus { border-color: var(--acc, #572e88); }
    .cl-answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; }
    @media (max-width: 820px) {
      .cl-modal-hero { grid-template-columns: 1fr; }
      .cl-modal-grid { grid-template-columns: 1fr; }
      .cl-answer-grid { grid-template-columns: 1fr; }
    }

    /* ── Collapsible profile sections - each colour-coded from the brand
       palette instead of one flat purple-grey tone throughout ── */
    .cl-modal-section { border: 1.5px solid color-mix(in srgb, var(--acc, #572e88) 30%, #fff); border-radius: 12px; background: color-mix(in srgb, var(--acc, #572e88) 5%, #fff); overflow: hidden; }
    .cl-modal-section.full { grid-column: 1 / -1; }
    .cl-acc-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.7rem; cursor: pointer; background: none; border: none; width: 100%; text-align: left; font-family: var(--bts-font); }
    .cl-acc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc, #572e88); flex-shrink: 0; }
    .cl-modal-section-title { flex: 1; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc, #572e88); }
    .cl-acc-chevron { flex-shrink: 0; color: var(--acc, #572e88); transition: transform 0.16s ease; font-size: 0.8rem; }
    .cl-modal-section.open .cl-acc-chevron { transform: rotate(180deg); }
    .cl-acc-body { display: none; padding: 0 0.7rem 0.7rem; }
    .cl-modal-section.open .cl-acc-body { display: block; }

    /* ── Editable fields ── */
    .cl-field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
    .cl-field { display: grid; gap: 0.2rem; }
    .cl-field-label { font-size: 0.72rem; font-weight: 800; color: rgba(0,0,0,0.62); line-height: 1.25; }
    .cl-field input { width: 100%; box-sizing: border-box; background: #fff; border: 1.5px solid rgba(0,0,0,0.28); color: #000000; border-radius: 7px; padding: 0.42rem 0.6rem; font-size: 0.83rem; font-family: var(--bts-font); outline: none; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); transition: border-color 0.15s, box-shadow 0.15s; }
    .cl-field input:hover { border-color: var(--acc, #572e88); }
    .cl-field input:focus { border-color: var(--acc, #572e88); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc, #572e88) 18%, transparent); }
    @media (max-width: 820px) { .cl-field-grid { grid-template-columns: 1fr; } }

    .cl-modal-save-bar { display: flex; align-items: center; gap: 0.7rem; justify-content: flex-end; margin-bottom: 0.7rem; }
    .cl-modal-save-status { font-size: 0.78rem; font-weight: 800; color: #769e7b; opacity: 0; transition: opacity 0.2s; }
    .cl-modal-save-status.visible { opacity: 1; }
    .cl-modal-save-btn { font-size: 0.82rem; font-weight: 900; border-radius: 8px; padding: 0.55rem 1.15rem; border: none; background: #572e88; color: #fff; cursor: pointer; font-family: var(--bts-font); transition: opacity 0.15s; }
    .cl-modal-save-btn:hover { opacity: 0.9; }
    .cl-modal-save-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .cl-empty { text-align: center; padding: 3rem 1rem; color: rgba(0,0,0,0.35); font-size: 0.88rem; }
    .cl-loading { color: rgba(0,0,0,0.38); font-size: 0.88rem; padding: 2rem 0; }
  </style>
</head>
<body>
  <div id="prod-sidebar-host"></div>
  <div class="prod-main">
    <div class="prod-main-inner">
      <div class="aud-visual-hero">
        <div class="aud-visual-hero-content">
          <div>
            <div class="aud-visual-kicker">
              <span class="aud-visual-kicker-dot" aria-hidden="true"></span>
              <span class="page-hierarchy"><span class="page-hierarchy-page">Cast</span></span>
            </div>
            <h1 class="aud-visual-title">Cast List</h1>
            <p class="aud-visual-copy">Every character and grouping with current casting decisions.</p>
          </div>
          <div style="display:flex;gap:0.6rem;flex-shrink:0;">
            <button class="btn-export" onclick="exportCSV()" style="background:#efab45;color:#000;border:none;border-radius:8px;padding:0.55rem 1.1rem;font-weight:900;font-size:0.82rem;cursor:pointer;">Export CSV</button>
            <button class="btn-export" onclick="exportPDF()" style="background:#572e88;color:#fff;border:none;border-radius:8px;padding:0.55rem 1.1rem;font-weight:900;font-size:0.82rem;cursor:pointer;">Export PDF</button>
          </div>
        </div>
      </div>
      <div id="cl-root"><div class="cl-loading">Loading...</div></div>
    </div>
  </div>
  <div id="cl-performer-modal" class="cl-modal-backdrop" onclick="closePerformerCard(event)">
    <div class="cl-modal-card" onclick="event.stopPropagation()">
      <div class="cl-modal-top">
        <div>
          <div class="page-kicker"><span class="page-kicker-dot"></span>Performer Profile</div>
          <div style="font-size:0.84rem;color:rgba(0,0,0,0.52);">Registration, conflicts, contact details, and cast info in one place.</div>
        </div>
        <button type="button" aria-label="Close performer profile" onclick="closePerformerCard()">&times;</button>
      </div>
      <div id="cl-performer-modal-body" class="cl-modal-body"></div>
    </div>
  </div>
  <div id="cl-add-role-modal" class="cl-modal-backdrop" onclick="closeAddRoleModal(event)">
    <div class="cl-add-role-card" onclick="event.stopPropagation()">
      <div class="cl-add-role-title">Add a Role</div>
      <div class="cl-add-role-sub" id="cl-add-role-sub"></div>
      <div class="cl-add-role-error" id="cl-add-role-error"></div>
      <div class="cl-add-role-field">
        <label class="cl-add-role-label">Character / Role</label>
        <select class="cl-add-role-select" id="cl-add-role-character"></select>
      </div>
      <div class="cl-add-role-actions">
        <button type="button" class="cl-add-role-cancel" onclick="closeAddRoleModal()">Cancel</button>
        <button type="button" class="cl-add-role-save" id="cl-add-role-save-btn" onclick="submitAddRole()">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/SHARED/Navigation/production-sidebar-nav.js?v=87-20260805-volunteers-roster"></script>
  <script>
    window.initProductionPage('cast');

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function initials(name) {
      return String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || 'P';
    }
    function parseMaybeObject(value) {
      if (!value) return {};
      if (typeof value === 'string') {
        try { return JSON.parse(value || '{}') || {}; } catch { return {}; }
      }
      return typeof value === 'object' ? value : {};
    }

    let _chars = [];
    let _assignments = [];
    let _prodTitle = '';
    let _performers = [];
    let _applicationIds = new Set();
    let _castMembers = [];
    let _performerDirectory = [];
    let _selectedPerformerId = null;
    let _view = 'programme';
    let _perfQuery = '';
    let _perfFilter = 'all';
    let sb = null;
    let prodId = '';

    // Conflicts editor state - mirrors the tap-a-date-tile picker in the
    // main applicant modal (production-workspace.js apmSetConflictDayType
    // etc.) so this reads and writes the exact same date_conflicts shape.
    let _rehearsalEvents = [];
    let _rehearsalEventsLoaded = false;
    let _clConflictMap = {};
    let _clConflictNotes = '';
    let _clConflictExpanded = new Set();
    const CL_REHEARSAL_EVENT_TYPES = new Set(['rehearsal', 'music_rehearsal', 'choreography', 'tech', 'dress', 'tech_rehearsal', 'dress_rehearsal']);

    const SORT_RANKS = {
      lead: 0, featured: 1, supporting: 2,
      dancer: 3, swing: 4, ensemble: 5, group: 6, other: 7,
    };
    function sortRank(char) {
      return SORT_RANKS[(char.role_type||'').toLowerCase()] ?? 7;
    }
    function isEnsemble(char) {
      return ['ensemble', 'group'].includes((char.role_type||'').toLowerCase());
    }

    function charLooksLikeEnsemble(char) {
      const name = String(char?.name || '').trim().toLowerCase();
      const roleType = String(char?.role_type || '').trim().toLowerCase();
      return name === 'ensemble' || roleType === 'ensemble';
    }

    function isRegisteredStatus(status) {
      const value = String(status || '').trim().toLowerCase();
      return value === 'complete' || value === 'completed' || value === 'registered' || value === 'done';
    }

    function registrationAnswers(record) {
      return parseMaybeObject(record?.registration_answers);
    }

    function performerDateConflicts(record) {
      return parseMaybeObject(record?.date_conflicts);
    }

    function firstFilledValue(list) {
      for (const value of list || []) {
        const text = String(value || '').trim();
        if (text) return text;
      }
      return '';
    }

    function displayNameForRecord(record, answers) {
      return firstFilledValue([
        record.preferred_name,
        answers['Preferred Name'],
        answers['Preferred name'],
        answers['Performer preferred name'],
        record.name,
        [answers['First Name'], answers['Last Name']].filter(Boolean).join(' '),
        record.email,
      ]);
    }

    function answerValue(answers, keys) {
      return firstFilledValue((keys || []).map(key => answers?.[key]));
    }

    function registrationStatusLabel(answers) {
      const raw = answerValue(answers, ['__bts_registration_status', 'registration_status']);
      return isRegisteredStatus(raw) ? 'Registration Complete' : 'Registration In Progress';
    }

    function registrationStatusClass(answers) {
      const raw = answerValue(answers, ['__bts_registration_status', 'registration_status']);
      return isRegisteredStatus(raw) ? 'good' : 'warn';
    }

    function roleTypeLabel(roleTypes) {
      const uniq = Array.from(new Set((roleTypes || []).filter(Boolean)));
      return uniq.length ? uniq.join(', ') : 'Cast Member';
    }

    function formatDate(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      const date = /^\d{4}-\d{2}-\d{2}$/.test(text) ? new Date(`${text}T12:00:00`) : new Date(text);
      if (Number.isNaN(date.getTime())) return text;
      return date.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function clFormatTime12h(t) {
      if (!t) return '';
      const [h, m] = String(t).slice(0, 5).split(':').map(Number);
      const ap = h >= 12 ? 'pm' : 'am';
      return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + ap;
    }
    function clConflictTimeLabel(value) {
      if (!value || typeof value !== 'object') return '';
      if (value.full_day === false) {
        const start = value.start_time ? clFormatTime12h(value.start_time) : '';
        const end = value.end_time ? clFormatTime12h(value.end_time) : '';
        if (start && end) return `${start} - ${end}`;
        if (start) return `From ${start}`;
        if (end) return `Until ${end}`;
        return '';
      }
      return String(value.time_label || value.time || value.details || '').trim();
    }
    function clConflictEventMap(conflicts) {
      const next = {};
      Object.entries(conflicts || {}).forEach(([key, value]) => {
        if (key === 'manual_notes') return;
        if (value && typeof value === 'object' && value.conflict) next[key] = { ...value };
        else if (value === true || value === 'true') next[key] = { conflict: true, full_day: true };
      });
      return next;
    }
    function clConflictPayloadFromState(conflictMap, manualNotes) {
      const payload = {};
      Object.keys(conflictMap || {}).sort().forEach(key => {
        const item = conflictMap[key];
        if (!item || item.conflict !== true) return;
        payload[key] = { conflict: true, title: item.title || '', date: item.date || '', full_day: item.full_day !== false };
        if (item.full_day === false) {
          if (item.start_time) payload[key].start_time = item.start_time;
          if (item.end_time) payload[key].end_time = item.end_time;
        }
      });
      const cleanNotes = String(manualNotes || '').trim();
      if (cleanNotes) payload.manual_notes = cleanNotes;
      return payload;
    }
    // Same weekday colour key as the applicant modal's conflict picker, so
    // this reads as the same visual system rather than a new invented one.
    function clConflictWeekdayColour(dateString) {
      const d = dateString ? new Date(`${dateString}T12:00:00`) : null;
      if (!(d instanceof Date) || Number.isNaN(d.getTime())) return '#74a2b4';
      const colours = { 0: '#dd8233', 1: '#74a2b4', 2: '#476aaa', 3: '#769e7b', 4: '#ca7ea7', 5: '#572e88', 6: '#d1523d' };
      return colours[d.getDay()] || '#74a2b4';
    }
    function clConflictDateParts(dateString) {
      const d = dateString ? new Date(`${dateString}T12:00:00`) : null;
      if (!(d instanceof Date) || Number.isNaN(d.getTime())) return { month: 'TBD', day: '--', weekday: '' };
      return {
        month: d.toLocaleDateString('en-CA', { month: 'short' }).toUpperCase(),
        day: String(d.getDate()),
        weekday: d.toLocaleDateString('en-CA', { weekday: 'short' }).toUpperCase(),
      };
    }
    async function loadRehearsalEvents() {
      if (_rehearsalEventsLoaded) return _rehearsalEvents;
      try {
        const { data, error } = await sb.from('production_events').select('id,title,event_type,start_time').eq('production_id', prodId).order('start_time', { ascending: true });
        if (error) throw error;
        _rehearsalEvents = (data || [])
          .filter(ev => ev?.id && ev?.start_time && CL_REHEARSAL_EVENT_TYPES.has(String(ev.event_type || '').toLowerCase()))
          .map(ev => ({ id: ev.id, title: ev.title || 'Rehearsal', date: String(ev.start_time).slice(0, 10) }));
      } catch (err) {
        console.warn('[BTS] loadRehearsalEvents failed', err);
        _rehearsalEvents = [];
      }
      _rehearsalEventsLoaded = true;
      return _rehearsalEvents;
    }

    function clConflictGridHtml() {
      if (!_rehearsalEvents.length) {
        return `<div class="cl-detail-value soft">No rehearsal dates are in the calendar yet.</div>`;
      }
      const tiles = _rehearsalEvents.map(ev => {
        const value = _clConflictMap[ev.id] || {};
        const active = !!value.conflict;
        const isExpanded = active && _clConflictExpanded.has(ev.id);
        const colour = clConflictWeekdayColour(ev.date);
        const parts = clConflictDateParts(ev.date);
        const isFullDay = value.full_day !== false;
        const caption = active && !isExpanded
          ? `<div class="cl-conflict-caption">${esc(isFullDay ? 'FULL DAY' : (clConflictTimeLabel(value) || 'TIME SET'))}</div>`
          : '';
        const dateBtn = `<button type="button" class="cl-conflict-tile${active ? ' active' : ''}" style="--tile:${colour};" onclick="clToggleConflictDate('${esc(ev.id)}')" title="${esc(ev.title)}">
          <div class="cl-conflict-badge"><div class="cl-conflict-badge-month">${esc(parts.month)}</div><div class="cl-conflict-badge-day">${esc(parts.day)}</div></div>
          <div class="cl-conflict-weekday">${esc(parts.weekday)}</div>
          ${caption}
        </button>`;
        if (!isExpanded) return dateBtn;
        const picker = `<div class="cl-conflict-picker">
          <div class="cl-conflict-picker-head">
            <div class="cl-conflict-picker-title">${esc(ev.title)}</div>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <div class="cl-conflict-picker-date">${esc(`${parts.month} ${parts.day} ${parts.weekday}`)}</div>
              <button type="button" class="cl-conflict-done-btn" onclick="clCollapseConflict('${esc(ev.id)}')">Done</button>
            </div>
          </div>
          <div class="cl-conflict-daytype-row">
            <button type="button" class="cl-conflict-daytype-btn${isFullDay ? ' active' : ''}" onclick="clSetConflictDayType('${esc(ev.id)}', true)">Full day</button>
            <button type="button" class="cl-conflict-daytype-btn${!isFullDay ? ' active' : ''}" onclick="clSetConflictDayType('${esc(ev.id)}', false)">Specific time</button>
          </div>
          ${isFullDay ? '' : `<div class="cl-field-grid" style="margin-top:0.5rem;">
            <div class="cl-field"><label class="cl-field-label">From</label><input type="time" value="${esc(value.start_time || '')}" oninput="clUpdateConflictTime('${esc(ev.id)}','start_time',this.value)" /></div>
            <div class="cl-field"><label class="cl-field-label">To</label><input type="time" value="${esc(value.end_time || '')}" oninput="clUpdateConflictTime('${esc(ev.id)}','end_time',this.value)" /></div>
          </div>`}
        </div>`;
        return dateBtn + picker;
      }).join('');
      return `<div class="cl-conflict-grid">${tiles}</div>`;
    }

    function clConflictSectionHtml() {
      return `<div id="cl-conflict-grid-wrap">${clConflictGridHtml()}</div>
        <textarea class="cl-conflict-notes" id="cl-conflict-notes" placeholder="Add any extra notes like vacations, school conflicts, or details the team should know." oninput="clConflictNotesInput(this.value)">${esc(_clConflictNotes)}</textarea>`;
    }

    function clRenderConflictGrid() {
      const wrap = document.getElementById('cl-conflict-grid-wrap');
      if (wrap) wrap.innerHTML = clConflictGridHtml();
      clMarkDirty();
    }
    function clToggleConflictDate(eventId) {
      const existing = _clConflictMap[eventId];
      if (existing && existing.conflict) {
        delete _clConflictMap[eventId];
        _clConflictExpanded.delete(eventId);
      } else {
        const ev = _rehearsalEvents.find(e => e.id === eventId);
        _clConflictMap[eventId] = { conflict: true, full_day: true, date: ev?.date || '', title: ev?.title || '' };
        _clConflictExpanded.add(eventId);
      }
      clRenderConflictGrid();
    }
    function clSetConflictDayType(eventId, isFullDay) {
      const item = _clConflictMap[eventId];
      if (!item) return;
      item.full_day = isFullDay;
      clRenderConflictGrid();
    }
    function clUpdateConflictTime(eventId, field, val) {
      const item = _clConflictMap[eventId];
      if (!item) return;
      item[field] = val;
      clMarkDirty();
    }
    function clCollapseConflict(eventId) {
      _clConflictExpanded.delete(eventId);
      clRenderConflictGrid();
    }
    function clConflictNotesInput(val) {
      _clConflictNotes = val;
      clMarkDirty();
    }

    function performerPhotoHtml(record, className, fallbackClass) {
      return record.headshot_url
        ? `<img class="${className}" src="${esc(record.headshot_url)}" alt="${esc(record.display_name || record.name || 'Performer')}" onerror="this.outerHTML='<div class=&quot;${fallbackClass}&quot;>${esc(initials(record.display_name || record.name || 'Performer'))}</div>'" />`
        : `<div class="${fallbackClass}">${esc(initials(record.display_name || record.name || 'Performer'))}</div>`;
    }

    function performerDirectoryRecords() {
      const charMap = new Map((_chars || []).map(char => [String(char.id || ''), char]));
      // cast_members has no dropped_out column of its own - _assignments is
      // already filtered to dropped_out=false, so cross-check against it to
      // keep dropped-out performers (e.g. Marley) out of this list.
      const activeApplicantIds = new Set((_assignments || []).map(a => String(a.applicant_id || '')));
      const byApplicant = new Map();
      (_castMembers || []).forEach(member => {
        const key = String(member.applicant_id || member.id || '');
        if (!key || !activeApplicantIds.has(key)) return;
        const answers = registrationAnswers(member);
        const existing = byApplicant.get(key);
        const roleName = String(member.character_name || '').trim();
        const roleType = charMap.get(String(member.character_id || ''))?.role_type || '';
        const nextDisplayName = displayNameForRecord(member, answers);
        const nextContactName = firstFilledValue([
          member.name,
          [answers['First Name'], answers['Last Name']].filter(Boolean).join(' '),
          nextDisplayName,
        ]);
        const nextEmail = firstFilledValue([member.email, answers['Contact Email'], answers['Email'], answers['Email Address']]);
        const nextPhone = firstFilledValue([member.phone, answers['Contact Phone'], answers['Phone'], answers['Phone Number']]);
        const nextGuardianName = firstFilledValue([member.guardian_name, answers['Guardian Name'], answers['Parent/Guardian Name']]);
        const nextGuardianEmail = firstFilledValue([member.guardian_email, answers['Guardian Email'], answers['Parent/Guardian Email']]);
        const nextGuardianPhone = firstFilledValue([member.guardian_phone, answers['Guardian Phone'], answers['Parent/Guardian Phone'], answers['Emergency Contact Phone']]);
        const nextPronouns = firstFilledValue([member.pronouns, answers['Pronouns']]);
        const nextProgrammeName = firstFilledValue([
          answers['Exact first and last name'],
          answers['Name as it should appear in the programme'],
          answers['Programme Credit'],
          answers['Program Credit'],
        ]);
        if (existing) {
          if (roleName && !existing.roles.includes(roleName)) existing.roles.push(roleName);
          if (roleType && !existing.roleTypes.includes(roleType)) existing.roleTypes.push(roleType);
          if (nextProgrammeName && !existing.programmeName) existing.programmeName = nextProgrammeName;
          if (nextPronouns && !existing.pronouns) existing.pronouns = nextPronouns;
          if (nextEmail && !existing.email) existing.email = nextEmail;
          if (nextPhone && !existing.phone) existing.phone = nextPhone;
          if (nextGuardianName && !existing.guardian_name) existing.guardian_name = nextGuardianName;
          if (nextGuardianEmail && !existing.guardian_email) existing.guardian_email = nextGuardianEmail;
          if (nextGuardianPhone && !existing.guardian_phone) existing.guardian_phone = nextGuardianPhone;
          if (member.headshot_url && !existing.headshot_url) existing.headshot_url = member.headshot_url;
          if (member.date_of_birth && !existing.date_of_birth) existing.date_of_birth = member.date_of_birth;
          if (member.state === 'offer_accepted') existing.state = 'offer_accepted';
          existing.answers = { ...existing.answers, ...answers };
          return;
        }
        byApplicant.set(key, {
          id: key,
          applicant_id: key,
          display_name: nextDisplayName || nextContactName || 'Performer',
          legal_name: nextContactName || nextDisplayName || 'Performer',
          pronouns: nextPronouns,
          email: nextEmail,
          phone: nextPhone,
          guardian_name: nextGuardianName,
          guardian_email: nextGuardianEmail,
          guardian_phone: nextGuardianPhone,
          programmeName: nextProgrammeName,
          date_of_birth: member.date_of_birth || '',
          headshot_url: member.headshot_url || '',
          state: member.state || 'chosen',
          roles: roleName ? [roleName] : [],
          roleTypes: roleType ? [roleType] : [],
          answers,
          date_conflicts: performerDateConflicts(member),
        });
      });
      return Array.from(byApplicant.values()).sort((a, b) => (a.display_name || '').localeCompare(b.display_name || ''));
    }

    function humanAge(dateString) {
      const dob = String(dateString || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dob)) return '';
      const birth = new Date(`${dob}T12:00:00`);
      if (Number.isNaN(birth.getTime())) return '';
      const today = new Date('2026-07-21T12:00:00');
      let age = today.getFullYear() - birth.getFullYear();
      const monthDelta = today.getMonth() - birth.getMonth();
      if (monthDelta < 0 || (monthDelta === 0 && today.getDate() < birth.getDate())) age -= 1;
      return age >= 0 ? `${age} yrs` : '';
    }

    function compactField(value, fallback = 'Not provided') {
      const text = String(value || '').trim();
      return text || fallback;
    }

    // Registration Answers should only show what families filled out at
    // registration - not what performers answered on the audition form
    // (custom_answers holds both, merged together on the same record).
    // These are the fixed field labels from SYSTEM/Public/audition.html.
    const AUDITION_FIELD_LABELS = new Set([
      'full name', 'preferred name', 'pronouns', 'date of birth', 'email', 'phone',
      'guardian name', 'guardian email or phone', 'theatre experience', 'acting experience',
      'acting experience level', 'acting experience details', 'skills', 'casting preference',
      'roles interested in', 'requested roles', 'other roles', 'gender preferences',
      'attendance type', 'schedule conflicts', 'conflict dates', 'additional notes',
      'audition materials', 'headshot / photo', 'headshot/photo', 'monologue',
      'song / piece', 'song/piece',
    ]);
    function cleanAnswerEntries(answers) {
      const hiddenKeys = new Set([
        '__bts_registration_status',
        '__bts_registration_complete',
        '__bts_registration_submitted_at',
        'registration_status',
        'registration_complete',
      ]);
      return Object.entries(answers || {})
        .filter(([key, value]) => {
          if (hiddenKeys.has(key)) return false;
          if (String(key || '').startsWith('__bts_')) return false;
          if (AUDITION_FIELD_LABELS.has(String(key || '').trim().toLowerCase())) return false;
          if (value === null || value === undefined) return false;
          if (typeof value === 'string' && !value.trim()) return false;
          return true;
        })
        .sort(([a], [b]) => a.localeCompare(b));
    }

    // Groups registration answers by topic so costume measurements, pickup/
    // check-in info, medical needs, and signed agreements each get their own
    // sub-header instead of one flat alphabetical list.
    const ANSWER_CATEGORIES = [
      { key: 'ans_costume', label: 'Costume & Measurements', color: '#ca7ea7', match: /costume|measurement|height|weight|shoe|waist|chest|hip|inseam|sleeve|\bsize\b/i },
      { key: 'ans_checkin', label: 'Check-In & Pickup', color: '#476aaa', match: /pick.?up|check.?in|dismissal|drop.?off|authoris|authoriz|sign.?out|release/i },
      { key: 'ans_medical', label: 'Medical & Accessibility', color: '#dd8233', match: /medical|allerg|accessib|accommodat|condition|epipen|inhaler|emergency/i },
      { key: 'ans_agreements', label: 'Agreements & Consents', color: '#78bbd4', match: /agreement|consent|waiver|code of conduct|media release|signed/i },
    ];
    const ANSWER_CATEGORY_GENERAL = { key: 'ans_general', label: 'General', color: '#572e88' };
    function answerCategoryFor(key) {
      return ANSWER_CATEGORIES.find(c => c.match.test(key)) || ANSWER_CATEGORY_GENERAL;
    }
    // Each category becomes its own top-level collapsible section (not
    // nested inside one big "Registration Answers" accordion), so a
    // producer can open just the costume group without wading through
    // check-in/medical/agreement fields too.
    function groupAnswerEntriesByCategory(entries) {
      const groups = new Map();
      entries.forEach(entry => {
        const cat = answerCategoryFor(entry[0]);
        if (!groups.has(cat.key)) groups.set(cat.key, { cat, entries: [] });
        groups.get(cat.key).entries.push(entry);
      });
      const order = [...ANSWER_CATEGORIES, ANSWER_CATEGORY_GENERAL];
      return order.filter(cat => groups.has(cat.key)).map(cat => groups.get(cat.key));
    }

    function formatAnswerValue(value) {
      if (Array.isArray(value)) return value.map(v => String(v || '').trim()).filter(Boolean).join(', ');
      if (typeof value === 'boolean') return value ? 'Yes' : 'No';
      if (typeof value === 'object' && value) return JSON.stringify(value, null, 2);
      return String(value || '').trim();
    }

    function answerLabel(key) {
      return String(key || '')
        .replace(/_/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function getAssigned(charId) {
      const char = _chars.find(c => c.id === charId);
      const matchesEnsembleFallback = char && charLooksLikeEnsemble(char);
      return _assignments
        .filter(a => (a.character_id === charId || (matchesEnsembleFallback && !a.character_id))
          && (a.state === 'chosen' || a.state === 'offer_accepted'))
        .map(a => ({
          perf: _performers.find(p => String(p.id) === String(a.applicant_id)),
          state: a.state,
        }))
        .filter(e => e.perf)
        .sort((a, b) => {
          if (a.state === 'offer_accepted' && b.state !== 'offer_accepted') return -1;
          if (b.state === 'offer_accepted' && a.state !== 'offer_accepted') return 1;
          return (a.perf?.name||'').localeCompare(b.perf?.name||'');
        });
    }

    function switchView(v, btn) {
      _view = v;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
    }

    function renderContent() {
      const el = document.getElementById('cl-content');
      if (!el) return;
      el.innerHTML = _view === 'programme' ? buildProgrammeHtml() : buildPerformerCardsHtml();
    }

    function namesHtml(charId, forTable) {
      const assigned = getAssigned(charId);
      if (!assigned.length) {
        return forTable
          ? `<div class="cl-perf-name open">Open</div>`
          : `<span class="cl-name open">Open</span>`;
      }
      const hasConsidering = _assignments.some(a => a.character_id === charId && a.state === 'considering');
      const items = assigned.map(e => {
        const name = e.perf.name || 'Unknown';
        return forTable
          ? `<div class="cl-perf-name">${esc(name)}</div>`
          : `<span class="cl-name">${esc(name)}</span>`;
      });
      if (hasConsidering && !assigned.length) {
        return forTable
          ? `<div class="cl-perf-name pending">Not yet confirmed</div>`
          : `<span class="cl-name pending">Not yet confirmed</span>`;
      }
      return items.join(forTable ? '' : '<br>');
    }

    function buildProgrammeHtml() {
      const byName = (a, b) => (a.name||'').localeCompare(b.name||'');
      const named = _chars.filter(c => !isEnsemble(c)).sort(byName);
      const ensemble = _chars.filter(c => isEnsemble(c)).sort(byName);

      const html = [...named, ...ensemble].map(c => `<div class="cl-row">
          <div class="cl-role">${esc(c.name)}</div>
          <div>${namesHtml(c.id, false)}</div>
        </div>`).join('');
      if (!_chars.length) {
        return `<div class="cl-empty">No characters added yet. Build the cast list from the <a href="#" onclick="btsProdNav('casting-board.html');return false;" style="color:#572e88;">Casting Board</a>.</div>`;
      }

      return `<div class="cl-programme-card">
        <div class="cl-programme-title">Cast List</div>
        ${html}
      </div>`;
    }

    function filteredPerformerDirectory() {
      return _performerDirectory.filter(record => {
        const matchFilter = _perfFilter === 'all'
          || (_perfFilter === 'assigned' && record.roles.length > 0)
          || (_perfFilter === 'unassigned' && record.roles.length === 0);
        if (!matchFilter) return false;
        if (!_perfQuery) return true;
        const q = _perfQuery.toLowerCase();
        return (record.display_name || '').toLowerCase().includes(q)
          || (record.email || '').toLowerCase().includes(q)
          || record.roles.some(r => r.toLowerCase().includes(q));
      }).sort((a, b) => (a.display_name || '').localeCompare(b.display_name || ''));
    }

    function clPerfSetFilter(f) { _perfFilter = f; renderContent(); }
    function clPerfSearch(q) {
      _perfQuery = q;
      renderContent();
      const input = document.getElementById('cl-perf-search-input');
      if (input) { input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
    }

    function buildPerformerCardsHtml() {
      if (!_performerDirectory.length) {
        return `<div class="cl-empty">No cast performers yet. Once people are cast, they’ll show up here with their details.</div>`;
      }
      const visible = filteredPerformerDirectory();
      const rows = visible.map((record, i) => {
        const answers = record.answers || {};
        const roleChips = record.roles.length
          ? record.roles.map(r => `<span class="cl-pill role">${esc(r)}</span>`).join('')
          : `<span class="cl-pill warn">No role assigned yet</span>`;
        return `<tr class="cl-perf-row${i % 2 ? ' alt' : ''}" onclick="openPerformerCard('${esc(record.id)}')">
          <td>
            <div class="cl-perf-name-cell">
              ${performerPhotoHtml(record, 'cl-performer-photo', 'cl-performer-photo-placeholder')}
              <div>
                <div class="cl-performer-name">${esc(record.display_name)}</div>
                ${record.pronouns ? `<div class="cl-performer-sub">${esc(record.pronouns)}</div>` : ''}
              </div>
            </div>
          </td>
          <td style="color:rgba(0,0,0,0.55);font-size:0.82rem;">${esc(record.email || '')}</td>
          <td><div class="cl-pill-row" style="margin-top:0;">${roleChips}</div></td>
          <td><span class="cl-pill ${registrationStatusClass(answers)}">${esc(registrationStatusLabel(answers))}</span></td>
          <td><button type="button" class="cl-add-role-btn" onclick="event.stopPropagation();openAddRoleModal('${esc(record.id)}')">+ Add Role</button></td>
        </tr>`;
      }).join('') || `<tr><td colspan="5"><div class="cl-empty" style="padding:2rem 0;">No performers match.</div></td></tr>`;

      return `
        <div class="cl-perf-toolbar">
          <div class="cl-perf-search">
            <svg class="cl-perf-search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#000000" stroke-width="1.6"/><path d="M10 10l3.5 3.5" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/></svg>
            <input type="search" id="cl-perf-search-input" placeholder="Search cast performers..." value="${esc(_perfQuery)}" oninput="clPerfSearch(this.value)" />
          </div>
          <div class="cl-perf-filters">
            <button class="cl-perf-filter-pill${_perfFilter==='all'?' active':''}" onclick="clPerfSetFilter('all')">All</button>
            <button class="cl-perf-filter-pill${_perfFilter==='assigned'?' active':''}" onclick="clPerfSetFilter('assigned')">Assigned</button>
            <button class="cl-perf-filter-pill${_perfFilter==='unassigned'?' active':''}" onclick="clPerfSetFilter('unassigned')">Needs a Role</button>
          </div>
          <div class="cl-perf-count">${visible.length} of ${_performerDirectory.length} cast performers</div>
        </div>
        <table class="cl-perf-table">
          <thead><tr>
            <th>Performer</th>
            <th>Email</th>
            <th>Role(s)</th>
            <th>Status</th>
            <th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function detailItem(label, value, soft = false) {
      return `<div class="cl-detail-item">
        <div class="cl-detail-label">${esc(label)}</div>
        <div class="cl-detail-value${soft ? ' soft' : ''}">${esc(value)}</div>
      </div>`;
    }

    // Sections open by default vs collapsed - keep the two edited-most-often
    // sections open, tuck the long/rarely-touched ones away.
    // Brand colours only - each section gets its own identity instead of
    // one flat purple-grey tone for everything. Every section starts closed.
    const CL_SECTION_COLOR = { contact: '#572e88', guardian: '#769e7b', registration: '#efab45', conflicts: '#d1523d' };
    function clAccordionSection(key, title, bodyHtml, { color, fullWidth } = {}) {
      const acc = color || CL_SECTION_COLOR[key] || '#572e88';
      const full = fullWidth || key === 'conflicts';
      return `<section class="cl-modal-section${full ? ' full' : ''}" data-section="${key}" style="--acc:${acc};">
        <button type="button" class="cl-acc-head" onclick="this.closest('.cl-modal-section').classList.toggle('open')">
          <span class="cl-acc-dot"></span>
          <span class="cl-modal-section-title">${esc(title)}</span>
          <span class="cl-acc-chevron">&#9660;</span>
        </button>
        <div class="cl-acc-body">${bodyHtml}</div>
      </section>`;
    }
    function clField(id, label, value, type = 'text') {
      return `<div class="cl-field">
        <label class="cl-field-label" for="${id}">${esc(label)}</label>
        <input type="${type}" id="${id}" value="${esc(value || '')}" oninput="clMarkDirty()" />
      </div>`;
    }

    async function openPerformerCard(id) {
      _selectedPerformerId = String(id || '');
      const record = _performerDirectory.find(item => String(item.id) === _selectedPerformerId);
      const modal = document.getElementById('cl-performer-modal');
      const body = document.getElementById('cl-performer-modal-body');
      if (!record || !modal || !body) return;
      await loadRehearsalEvents();
      const rawConflicts = record.date_conflicts || {};
      _clConflictMap = clConflictEventMap(rawConflicts);
      _clConflictNotes = String(rawConflicts.manual_notes || '').trim();
      _clConflictExpanded = new Set();
      const answers = record.answers || {};
      const answerEntries = cleanAnswerEntries(answers);
      body.innerHTML = `
        <div class="cl-modal-hero">
          <div>${performerPhotoHtml(record, 'cl-modal-photo', 'cl-modal-photo-placeholder')}</div>
          <div>
            <h2 class="cl-modal-name">${esc(record.display_name)}</h2>
            <div class="cl-modal-sub">${esc([
              humanAge(record.date_of_birth),
              record.pronouns,
              record.state === 'offer_accepted' ? 'Offer accepted' : 'Chosen for cast'
            ].filter(Boolean).join(' · '))}</div>
            <div class="cl-pill-row" style="margin-top:0.8rem;">
              <span class="cl-pill ${registrationStatusClass(answers)}">${esc(registrationStatusLabel(answers))}</span>
              <span class="cl-pill role">${esc(roleTypeLabel(record.roleTypes))}</span>
              ${record.programmeName ? `<span class="cl-pill soft">Programme: ${esc(record.programmeName)}</span>` : ''}
            </div>
            <div class="cl-modal-sub" style="margin-top:0.8rem;">Roles: ${esc(record.roles.join(', ') || 'No roles set yet')}</div>
          </div>
        </div>
        <div class="cl-modal-save-bar">
          <span class="cl-modal-save-status" id="cl-modal-save-status">Saved</span>
          <button type="button" class="cl-modal-save-btn" id="cl-modal-save-btn" onclick="clSavePerformerEdits()" disabled>Save Changes</button>
        </div>
        <div class="cl-modal-grid">
          ${clAccordionSection('conflicts', 'Days Off / Conflicts', clConflictSectionHtml())}
          ${clAccordionSection('contact', 'Contact', `
            <div class="cl-field-grid">
              ${clField('cl-edit-legal-name', 'Legal / Full Name', record.legal_name)}
              ${clField('cl-edit-pronouns', 'Pronouns', record.pronouns)}
              ${clField('cl-edit-email', 'Email', record.email, 'email')}
              ${clField('cl-edit-phone', 'Phone', record.phone, 'tel')}
              ${clField('cl-edit-dob', 'Date of Birth', record.date_of_birth ? String(record.date_of_birth).slice(0, 10) : '', 'date')}
            </div>`)}
          ${clAccordionSection('guardian', 'Guardian / Family', `
            <div class="cl-field-grid">
              ${clField('cl-edit-guardian-name', 'Guardian Name', record.guardian_name)}
              ${clField('cl-edit-guardian-email', 'Guardian Email', record.guardian_email, 'email')}
              ${clField('cl-edit-guardian-phone', 'Guardian Phone', record.guardian_phone, 'tel')}
            </div>`)}
          ${clAccordionSection('registration', 'Registration', `
            <div class="cl-detail-list">
              ${detailItem('Status', registrationStatusLabel(answers))}
              ${detailItem('Role Type', roleTypeLabel(record.roleTypes))}
              ${detailItem('Roles', compactField(record.roles.join(', ')), !record.roles.length)}
              ${detailItem('Programme Name', compactField(record.programmeName), !record.programmeName)}
            </div>`)}
          ${answerEntries.length
              ? groupAnswerEntriesByCategory(answerEntries).map(({ cat, entries }) => clAccordionSection(cat.key, cat.label, `
                  <div class="cl-answer-grid">${entries.map(([key, value]) => `
                    <div class="cl-field">
                      <label class="cl-field-label">${esc(answerLabel(key))}</label>
                      <input type="text" data-answer-key="${esc(key)}" value="${esc(formatAnswerValue(value))}" oninput="clMarkDirty()" />
                    </div>`).join('')}</div>`, { color: cat.color, fullWidth: true })).join('')
              : clAccordionSection('answers', 'Registration Answers', `<div class="cl-detail-value soft">No registration answers have been saved yet for this performer.</div>`, { color: '#572e88', fullWidth: true })}
        </div>`;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function clMarkDirty() {
      const btn = document.getElementById('cl-modal-save-btn');
      const status = document.getElementById('cl-modal-save-status');
      if (btn) btn.disabled = false;
      if (status) status.classList.remove('visible');
    }

    // Contact/Guardian fields live on cast_members (denormalized, one row per
    // character the performer holds) rather than the audition record itself,
    // so a save writes every row sharing this applicant_id to keep them in
    // sync - the same reason Add Role mirrors into cast_members on write.
    async function clSavePerformerEdits() {
      const record = _performerDirectory.find(item => String(item.id) === _selectedPerformerId);
      const btn = document.getElementById('cl-modal-save-btn');
      const status = document.getElementById('cl-modal-save-status');
      if (!record || !btn) return;
      const val = id => document.getElementById(id).value.trim();
      const payload = {
        name: val('cl-edit-legal-name') || null,
        pronouns: val('cl-edit-pronouns') || null,
        email: val('cl-edit-email') || null,
        phone: val('cl-edit-phone') || null,
        guardian_name: val('cl-edit-guardian-name') || null,
        guardian_email: val('cl-edit-guardian-email') || null,
        guardian_phone: val('cl-edit-guardian-phone') || null,
      };
      const dobVal = val('cl-edit-dob');
      if (dobVal) payload.date_of_birth = dobVal;
      payload.date_conflicts = clConflictPayloadFromState(_clConflictMap, _clConflictNotes);
      // Registration Answers inputs write back into the same JSONB blob they
      // came from, keyed by their original answer key - everything not shown
      // here (hidden __bts_ flags, audition-form answers) passes through
      // untouched since we start from the existing object.
      const answerInputs = document.querySelectorAll('#cl-performer-modal-body [data-answer-key]');
      if (answerInputs.length) {
        const nextAnswers = { ...(record.answers || {}) };
        answerInputs.forEach(input => { nextAnswers[input.dataset.answerKey] = input.value.trim(); });
        payload.registration_answers = nextAnswers;
      }
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const { error } = await sb.from('cast_members').update(payload)
          .eq('production_id', prodId).eq('applicant_id', record.applicant_id);
        if (error) throw error;
        // date_conflicts on cast_members is a local cache for this page -
        // Auditions, the applicant modal, and everywhere else read it off
        // audition_applications directly (pronouns/date_conflicts/custom_answers
        // are Clio-only and never mirrored to audition_bookings), so write
        // there too whenever this performer's id is an application id.
        if (_applicationIds.has(String(record.applicant_id))) {
          const { error: appError } = await sb.from('audition_applications')
            .update({ date_conflicts: payload.date_conflicts })
            .eq('production_id', prodId).eq('id', record.applicant_id);
          if (appError) console.warn('[BTS] conflict sync to audition_applications failed', appError);
        }
        await loadCastListData();
        await openPerformerCard(_selectedPerformerId);
        const savedStatus = document.getElementById('cl-modal-save-status');
        if (savedStatus) savedStatus.classList.add('visible');
      } catch (err) {
        alert('Could not save: ' + (err.message || 'Unknown error'));
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    }

    function closePerformerCard(event) {
      if (event && event.target && event.target !== event.currentTarget) return;
      _selectedPerformerId = null;
      const modal = document.getElementById('cl-performer-modal');
      if (modal) modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    // Casting is progressive here - some characters aren't cast until weeks
    // into rehearsal, so this lets a producer add a role to an existing
    // performer straight from the Performers list instead of going back to
    // the Casting Board. Writes casting_assignments (source of truth) and
    // mirrors it into cast_members (what this page and costumes/portals/
    // script-breakdown all read from) the same way the SPA's
    // upsertCastMember()/finalCastingSetOfferAssignmentState() do.
    let _addRolePerformerId = null;
    function openAddRoleModal(performerId) {
      const record = _performerDirectory.find(r => String(r.id) === String(performerId));
      if (!record) return;
      _addRolePerformerId = performerId;
      document.getElementById('cl-add-role-error').classList.remove('visible');
      document.getElementById('cl-add-role-sub').textContent = `Assign ${record.display_name} to another character.`;
      const heldNames = new Set(record.roles.map(r => r.toLowerCase()));
      // Group by whether the role is already filled so an open ensemble slot
      // doesn't get buried under twenty already-cast principal roles - and
      // flag who's already in a role before double-casting it.
      const assigneesByChar = new Map();
      _castMembers.forEach(member => {
        if (!member.character_id || String(member.applicant_id) === String(record.applicant_id)) return;
        const answers = registrationAnswers(member);
        const name = displayNameForRecord(member, answers) || 'Unknown';
        const key = String(member.character_id);
        if (!assigneesByChar.has(key)) assigneesByChar.set(key, []);
        assigneesByChar.get(key).push(name);
      });
      const sortedChars = [..._chars].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      const openChars = sortedChars.filter(c => !assigneesByChar.has(String(c.id)));
      const filledChars = sortedChars.filter(c => assigneesByChar.has(String(c.id)));
      const optionHtml = c => {
        const held = heldNames.has(String(c.name || '').toLowerCase());
        const filledBy = assigneesByChar.get(String(c.id));
        const label = held ? `${c.name || ''} (already assigned to this performer)`
          : filledBy ? `${c.name || ''} · cast: ${filledBy.join(', ')}`
          : c.name || '';
        return `<option value="${esc(c.id)}"${held ? ' disabled' : ''}>${esc(label)}</option>`;
      };
      const select = document.getElementById('cl-add-role-character');
      select.innerHTML =
        (openChars.length ? `<optgroup label="Open roles">${openChars.map(optionHtml).join('')}</optgroup>` : '') +
        (filledChars.length ? `<optgroup label="Already cast">${filledChars.map(optionHtml).join('')}</optgroup>` : '');
      document.getElementById('cl-add-role-modal').classList.add('open');
    }
    function closeAddRoleModal(event) {
      if (event && event.target && event.target !== event.currentTarget) return;
      _addRolePerformerId = null;
      const modal = document.getElementById('cl-add-role-modal');
      if (modal) modal.classList.remove('open');
    }
    async function submitAddRole() {
      const record = _performerDirectory.find(r => String(r.id) === String(_addRolePerformerId));
      const errEl = document.getElementById('cl-add-role-error');
      errEl.classList.remove('visible');
      if (!record) return;
      const characterId = document.getElementById('cl-add-role-character').value;
      const state = 'offer_accepted'; // added directly here - no separate approval step needed
      const character = _chars.find(c => String(c.id) === String(characterId));
      if (!characterId || !character) {
        errEl.textContent = 'Choose a character.';
        errEl.classList.add('visible');
        return;
      }
      const saveBtn = document.getElementById('cl-add-role-save-btn');
      saveBtn.disabled = true;
      try {
        const { data: existingRows, error: findError } = await sb.from('casting_assignments')
          .select('id').eq('production_id', prodId).eq('applicant_id', record.applicant_id).eq('character_id', characterId).limit(1);
        if (findError) throw findError;
        if (existingRows && existingRows[0]) {
          await sb.from('casting_assignments').update({ state, dropped_out: false }).eq('id', existingRows[0].id);
        } else {
          await sb.from('casting_assignments').insert({ production_id: prodId, applicant_id: record.applicant_id, character_id: characterId, state });
        }
        await sb.from('cast_members').upsert({
          production_id: prodId,
          applicant_id: record.applicant_id,
          character_id: characterId,
          character_name: character.name || null,
          state,
          name: record.legal_name || record.display_name || null,
          preferred_name: record.display_name || null,
          pronouns: record.pronouns || null,
          date_of_birth: record.date_of_birth || null,
          email: record.email || null,
          phone: record.phone || null,
          guardian_name: record.guardian_name || null,
          guardian_email: record.guardian_email || null,
          guardian_phone: record.guardian_phone || null,
          headshot_url: record.headshot_url || null,
          registration_answers: record.answers || {},
          updated_at: new Date().toISOString(),
        }, { onConflict: 'production_id,applicant_id,character_id' });
        closeAddRoleModal();
        await loadCastListData();
      } catch (err) {
        errEl.textContent = err.message || 'Could not save this role.';
        errEl.classList.add('visible');
      } finally {
        saveBtn.disabled = false;
      }
    }

    // Shared, filesystem-safe base name so both CSV and PDF exports are
    // actually labelled with the show and the date they were exported,
    // instead of a bare generic "cast-list".
    function exportFileLabel() {
      const showSlug = String(_prodTitle || 'Production').trim().replace(/'/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'Production';
      const dateSlug = new Date().toISOString().slice(0, 10);
      return showSlug + '_Cast-List_' + dateSlug;
    }

    function exportCSV() {
      const sorted = [..._chars].sort((a, b) => sortRank(a) - sortRank(b) || (a.name||'').localeCompare(b.name||''));
      const rows = [['Character / Role', 'Performer(s)', 'Role Type', 'Status']];
      sorted.forEach(c => {
        const assigned = getAssigned(c.id);
        const names = assigned.length ? assigned.map(e => e.perf.name || '').join('; ') : 'Open';
        const status = assigned.length ? assigned[0].state : 'open';
        rows.push([c.name || '', names, c.role_type || '', status]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = exportFileLabel() + '.csv';
      a.click();
    }

    // Opens a print-formatted window and triggers the browser's print dialog,
    // same pattern as cast-checkin.html's attendance sheet - "Save as PDF" is
    // a built-in browser print destination, no PDF library needed.
    function exportPDF() {
      const byName = (a, b) => (a.name||'').localeCompare(b.name||'');
      const named = _chars.filter(c => !isEnsemble(c)).sort(byName);
      const ensemble = _chars.filter(c => isEnsemble(c)).sort(byName);
      // Every performer name on a separate line under a multi-cast role (like
      // the on-screen Ensemble list) counts as its own visual line, so a
      // one-page fit has to account for those, not just one row per character.
      function lineCount(chars) {
        return chars.reduce((sum, c) => {
          const n = getAssigned(c.id).length;
          return sum + Math.max(1, n);
        }, chars.length);
      }
      const totalLines = lineCount(named) + lineCount(ensemble);
      // Tiered shrink so a big cast still lands on one 8.5x11 page instead of
      // spilling to a second - tuned against real cast lists during testing.
      let rowPad = '6px 10px', nameFs = '12px', roleFs = '12px';
      if (totalLines > 70) { rowPad = '2.5px 10px'; nameFs = '9px'; roleFs = '9px'; }
      else if (totalLines > 50) { rowPad = '3.5px 10px'; nameFs = '10px'; roleFs = '10px'; }
      else if (totalLines > 32) { rowPad = '4.5px 10px'; nameFs = '11px'; roleFs = '11px'; }

      function rowsHtml(chars) {
        return chars.map(c => {
          const assigned = getAssigned(c.id);
          const names = assigned.length ? assigned.map(e => esc(e.perf.name || 'Unknown')).join('<br>') : '<span style="color:#999;font-style:italic;">Open</span>';
          return '<div class="row"><div class="role">' + esc(c.name || '') + '</div><div class="perf">' + names + '</div></div>';
        }).join('');
      }

      const printTitle = (_prodTitle || 'Cast List') + ' - Cast List - ' + new Date().toISOString().slice(0, 10);
      const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + esc(printTitle) + '</title>' +
        '<style>' +
          '@page{size:letter;margin:0.5in;}' +
          '*{box-sizing:border-box;}' +
          'body{font-family:Arial,Helvetica,sans-serif;color:#000;margin:0;padding:0;}' +
          'h1{margin:0 0 12px;font-size:22px;font-weight:900;text-align:center;}' +
          '.col-heads{display:flex;font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8c8c94;padding:0 0 3px;}' +
          '.col-heads .role{flex:1;text-align:right;padding-right:14px;}.col-heads .perf{flex:1;text-align:left;padding-left:14px;}' +
          '.row{display:flex;padding:' + rowPad + ';}' +
          '.row .role{flex:1;font-weight:800;font-size:' + nameFs + ';color:#000;text-align:right;padding-right:14px;}' +
          '.row .perf{flex:1;font-size:' + roleFs + ';color:#222;line-height:1.35;text-align:left;padding-left:14px;}' +
          '@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}' +
        '</style></head><body>' +
        '<h1>Cast List</h1>' +
        '<div class="col-heads"><span class="role">Character / Role</span><span class="perf">Performer(s)</span></div>' +
        rowsHtml([...named, ...ensemble]) +
        '<script>window.onload=function(){window.print();}<\/script></body></html>';

      const win = window.open('', '_blank');
      if (!win) { alert('Please allow pop-ups to export a PDF.'); return; }
      win.document.write(html);
      win.document.close();
    }

    async function loadCastListData() {

      sb = sb || supabase.createClient(SB_URL, SB_ANON);
