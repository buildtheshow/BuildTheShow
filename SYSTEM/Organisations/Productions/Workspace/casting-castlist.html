            <button class="btn-export" onclick="exportPDF()" style="background:#572e88;color:#fff;border:none;border-radius:8px;padding:0.55rem 1.1rem;font-weight:900;font-size:0.82rem;cursor:pointer;">Export PDF</button>

    <div class="cl-modal-card" onclick="event.stopPropagation()">
      <div class="cl-modal-top">
        <div>
          <div class="page-kicker"><span class="page-kicker-dot"></span>Performer Profile</div>
          <div style="font-size:0.84rem;color:rgba(0,0,0,0.52);">Registration, conflicts, contact details, and cast info in one place.</div>
        </div>

      <div class="cl-add-role-title">Add a Role</div>

      <div class="cl-add-role-actions">
        <button type="button" class="cl-add-role-cancel" onclick="closeAddRoleModal()">Cancel</button>
        <button type="button" class="cl-add-role-save" id="cl-add-role-save-btn" onclick="submitAddRole()">Save</button>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/SHARED/Navigation/production-sidebar-nav.js?v=87-20260805-volunteers-roster"></script>
  <script>
    window.initProductionPage('cast');

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function initials(name) {
      return String(name || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || 'P';
    }
    function parseMaybeObject(value) {
      if (!value) return {};
      if (typeof value === 'string') {
        try { return JSON.parse(value || '{}') || {}; } catch { return {}; }
      }
      return typeof value === 'object' ? value : {};
    }

    let _chars = [];
    let _assignments = [];
    let _prodTitle = '';
    let _performers = [];
    let _castMembers = [];
    let _performerDirectory = [];
    let _selectedPerformerId = null;
    let _view = 'programme';
    let _perfQuery = '';
    let _perfFilter = 'all';
    let sb = null;
    let prodId = '';

    const SORT_RANKS = {
      lead: 0, featured: 1, supporting: 2,
      dancer: 3, swing: 4, ensemble: 5, group: 6, other: 7,
    };
    function sortRank(char) {
      return SORT_RANKS[(char.role_type||'').toLowerCase()] ?? 7;
    }
    function isEnsemble(char) {
      return ['ensemble', 'group'].includes((char.role_type||'').toLowerCase());
    }

    function charLooksLikeEnsemble(char) {
      const name = String(char?.name || '').trim().toLowerCase();
      const roleType = String(char?.role_type || '').trim().toLowerCase();
      return name === 'ensemble' || roleType === 'ensemble';
    }

    function isRegisteredStatus(status) {
      const value = String(status || '').trim().toLowerCase();
      return value === 'complete' || value === 'completed' || value === 'registered' || value === 'done';
    }

    function registrationAnswers(record) {
      return parseMaybeObject(record?.registration_answers);
    }

    function performerDateConflicts(record) {
      return parseMaybeObject(record?.date_conflicts);
    }

    function firstFilledValue(list) {
      for (const value of list || []) {
        const text = String(value || '').trim();
        if (text) return text;
      }
      return '';
    }

    function displayNameForRecord(record, answers) {
      return firstFilledValue([
        record.preferred_name,
        answers['Preferred Name'],
        answers['Preferred name'],
        answers['Performer preferred name'],
        record.name,
        [answers['First Name'], answers['Last Name']].filter(Boolean).join(' '),
        record.email,
      ]);
    }

    function answerValue(answers, keys) {
      return firstFilledValue((keys || []).map(key => answers?.[key]));
    }

    function registrationStatusLabel(answers) {
      const raw = answerValue(answers, ['__bts_registration_status', 'registration_status']);
      return isRegisteredStatus(raw) ? 'Registration Complete' : 'Registration In Progress';
    }

    function registrationStatusClass(answers) {
      const raw = answerValue(answers, ['__bts_registration_status', 'registration_status']);
      return isRegisteredStatus(raw) ? 'good' : 'warn';
    }

    function roleTypeLabel(roleTypes) {
      const uniq = Array.from(new Set((roleTypes || []).filter(Boolean)));
      return uniq.length ? uniq.join(', ') : 'Cast Member';
    }

    function formatDate(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      const date = /^\d{4}-\d{2}-\d{2}$/.test(text) ? new Date(`${text}T12:00:00`) : new Date(text);
      if (Number.isNaN(date.getTime())) return text;
      return date.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatConflictLines(conflicts) {
      const lines = [];
      Object.entries(conflicts || {}).forEach(([key, value]) => {
        if (key === 'manual_notes') return;
        const entry = value && typeof value === 'object' ? value : { conflict: value === true || value === 'true' };
        if (!entry.conflict) return;
        const base = entry.date ? formatDate(entry.date) : (entry.title || key);
        const title = entry.title && entry.title !== base ? entry.title : '';
        const timeLabel = String(entry.time_label || entry.time || entry.details || '').trim();
        lines.push([base, title, timeLabel].filter(Boolean).join(' — '));
      });
      const manual = String(conflicts?.manual_notes || '').trim();
      if (manual) lines.push(manual);
      return lines.filter(Boolean);
    }

    function performerPhotoHtml(record, className, fallbackClass) {
      return record.headshot_url
        ? `<img class="${className}" src="${esc(record.headshot_url)}" alt="${esc(record.display_name || record.name || 'Performer')}" onerror="this.outerHTML='<div class=&quot;${fallbackClass}&quot;>${esc(initials(record.display_name || record.name || 'Performer'))}</div>'" />`
        : `<div class="${fallbackClass}">${esc(initials(record.display_name || record.name || 'Performer'))}</div>`;
    }

    function performerDirectoryRecords() {
      const charMap = new Map((_chars || []).map(char => [String(char.id || ''), char]));
      // cast_members has no dropped_out column of its own - _assignments is
      // already filtered to dropped_out=false, so cross-check against it to
      // keep dropped-out performers (e.g. Marley) out of this list.
      const activeApplicantIds = new Set((_assignments || []).map(a => String(a.applicant_id || '')));
      const byApplicant = new Map();
      (_castMembers || []).forEach(member => {
        const key = String(member.applicant_id || member.id || '');
        if (!key || !activeApplicantIds.has(key)) return;
        const answers = registrationAnswers(member);
        const existing = byApplicant.get(key);
        const roleName = String(member.character_name || '').trim();
        const roleType = charMap.get(String(member.character_id || ''))?.role_type || '';
        const nextDisplayName = displayNameForRecord(member, answers);
        const nextContactName = firstFilledValue([
          member.name,
          [answers['First Name'], answers['Last Name']].filter(Boolean).join(' '),
          nextDisplayName,
        ]);
        const nextEmail = firstFilledValue([member.email, answers['Contact Email'], answers['Email'], answers['Email Address']]);
        const nextPhone = firstFilledValue([member.phone, answers['Contact Phone'], answers['Phone'], answers['Phone Number']]);
        const nextGuardianName = firstFilledValue([member.guardian_name, answers['Guardian Name'], answers['Parent/Guardian Name']]);
        const nextGuardianEmail = firstFilledValue([member.guardian_email, answers['Guardian Email'], answers['Parent/Guardian Email']]);
        const nextGuardianPhone = firstFilledValue([member.guardian_phone, answers['Guardian Phone'], answers['Parent/Guardian Phone'], answers['Emergency Contact Phone']]);
        const nextPronouns = firstFilledValue([member.pronouns, answers['Pronouns']]);
        const nextProgrammeName = firstFilledValue([
          answers['Exact first and last name'],
          answers['Name as it should appear in the programme'],
          answers['Programme Credit'],
          answers['Program Credit'],
        ]);
        if (existing) {
          if (roleName && !existing.roles.includes(roleName)) existing.roles.push(roleName);
          if (roleType && !existing.roleTypes.includes(roleType)) existing.roleTypes.push(roleType);
          if (nextProgrammeName && !existing.programmeName) existing.programmeName = nextProgrammeName;
          if (nextPronouns && !existing.pronouns) existing.pronouns = nextPronouns;
          if (nextEmail && !existing.email) existing.email = nextEmail;
          if (nextPhone && !existing.phone) existing.phone = nextPhone;
          if (nextGuardianName && !existing.guardian_name) existing.guardian_name = nextGuardianName;
          if (nextGuardianEmail && !existing.guardian_email) existing.guardian_email = nextGuardianEmail;
          if (nextGuardianPhone && !existing.guardian_phone) existing.guardian_phone = nextGuardianPhone;
          if (member.headshot_url && !existing.headshot_url) existing.headshot_url = member.headshot_url;
          if (member.date_of_birth && !existing.date_of_birth) existing.date_of_birth = member.date_of_birth;
          if (member.state === 'offer_accepted') existing.state = 'offer_accepted';
          existing.answers = { ...existing.answers, ...answers };
          return;
        }
        byApplicant.set(key, {
          id: key,
          applicant_id: key,
          display_name: nextDisplayName || nextContactName || 'Performer',
          legal_name: nextContactName || nextDisplayName || 'Performer',
          pronouns: nextPronouns,
          email: nextEmail,
          phone: nextPhone,
          guardian_name: nextGuardianName,
          guardian_email: nextGuardianEmail,
          guardian_phone: nextGuardianPhone,
          programmeName: nextProgrammeName,
          date_of_birth: member.date_of_birth || '',
          headshot_url: member.headshot_url || '',
          state: member.state || 'chosen',
          roles: roleName ? [roleName] : [],
          roleTypes: roleType ? [roleType] : [],
          answers,
          date_conflicts: performerDateConflicts(member),
        });
      });
      return Array.from(byApplicant.values()).sort((a, b) => (a.display_name || '').localeCompare(b.display_name || ''));
    }

    function humanAge(dateString) {
      const dob = String(dateString || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dob)) return '';
      const birth = new Date(`${dob}T12:00:00`);
      if (Number.isNaN(birth.getTime())) return '';
      const today = new Date('2026-07-21T12:00:00');
      let age = today.getFullYear() - birth.getFullYear();
      const monthDelta = today.getMonth() - birth.getMonth();
      if (monthDelta < 0 || (monthDelta === 0 && today.getDate() < birth.getDate())) age -= 1;
      return age >= 0 ? `${age} yrs` : '';
    }

    function compactField(value, fallback = 'Not provided') {
      const text = String(value || '').trim();
      return text || fallback;
    }

    function cleanAnswerEntries(answers) {
      const hiddenKeys = new Set([
        '__bts_registration_status',
        '__bts_registration_complete',
        '__bts_registration_submitted_at',
        'registration_status',
        'registration_complete',
      ]);
      return Object.entries(answers || {})
        .filter(([key, value]) => {
          if (hiddenKeys.has(key)) return false;
          if (String(key || '').startsWith('__bts_')) return false;
          if (value === null || value === undefined) return false;
          if (typeof value === 'string' && !value.trim()) return false;
          return true;
        })
        .sort(([a], [b]) => a.localeCompare(b));
    }

    function formatAnswerValue(value) {
      if (Array.isArray(value)) return value.map(v => String(v || '').trim()).filter(Boolean).join(', ');
      if (typeof value === 'boolean') return value ? 'Yes' : 'No';
      if (typeof value === 'object' && value) return JSON.stringify(value, null, 2);
      return String(value || '').trim();
    }

    function answerLabel(key) {
      return String(key || '')
        .replace(/_/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function getAssigned(charId) {
      const char = _chars.find(c => c.id === charId);
      const matchesEnsembleFallback = char && charLooksLikeEnsemble(char);
      return _assignments
        .filter(a => (a.character_id === charId || (matchesEnsembleFallback && !a.character_id))
          && (a.state === 'chosen' || a.state === 'offer_accepted'))
        .map(a => ({
          perf: _performers.find(p => String(p.id) === String(a.applicant_id)),
          state: a.state,
        }))
        .filter(e => e.perf)
        .sort((a, b) => {
          if (a.state === 'offer_accepted' && b.state !== 'offer_accepted') return -1;
          if (b.state === 'offer_accepted' && a.state !== 'offer_accepted') return 1;
          return (a.perf?.name||'').localeCompare(b.perf?.name||'');
        });
    }

    function switchView(v, btn) {
      _view = v;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
    }

    function renderContent() {
      const el = document.getElementById('cl-content');
      if (!el) return;
      el.innerHTML = _view === 'programme' ? buildProgrammeHtml() : buildPerformerCardsHtml();
    }

    function namesHtml(charId, forTable) {
      const assigned = getAssigned(charId);
      if (!assigned.length) {
        return forTable
          ? `<div class="cl-perf-name open">Open</div>`
          : `<span class="cl-name open">Open</span>`;
      }
      const hasConsidering = _assignments.some(a => a.character_id === charId && a.state === 'considering');
      const items = assigned.map(e => {
        const name = e.perf.name || 'Unknown';
        return forTable
          ? `<div class="cl-perf-name">${esc(name)}</div>`
          : `<span class="cl-name">${esc(name)}</span>`;
      });
      if (hasConsidering && !assigned.length) {
        return forTable
          ? `<div class="cl-perf-name pending">Not yet confirmed</div>`
          : `<span class="cl-name pending">Not yet confirmed</span>`;
      }
      return items.join(forTable ? '' : '<br>');
    }

    function buildProgrammeHtml() {
      const byName = (a, b) => (a.name||'').localeCompare(b.name||'');
      const named = _chars.filter(c => !isEnsemble(c)).sort(byName);
      const ensemble = _chars.filter(c => isEnsemble(c)).sort(byName);

      const html = [...named, ...ensemble].map(c => `<div class="cl-row">
          <div class="cl-role">${esc(c.name)}</div>
          <div>${namesHtml(c.id, false)}</div>
        </div>`).join('');
      if (!_chars.length) {
        return `<div class="cl-empty">No characters added yet. Build the cast list from the <a href="#" onclick="btsProdNav('casting-board.html');return false;" style="color:#572e88;">Casting Board</a>.</div>`;
      }

      return `<div class="cl-programme-card">
        <div class="cl-programme-title">Cast List</div>
        ${html}
      </div>`;
    }

    function filteredPerformerDirectory() {
      return _performerDirectory.filter(record => {
        const matchFilter = _perfFilter === 'all'
          || (_perfFilter === 'assigned' && record.roles.length > 0)
          || (_perfFilter === 'unassigned' && record.roles.length === 0);
        if (!matchFilter) return false;
        if (!_perfQuery) return true;
        const q = _perfQuery.toLowerCase();
        return (record.display_name || '').toLowerCase().includes(q)
          || (record.email || '').toLowerCase().includes(q)
          || record.roles.some(r => r.toLowerCase().includes(q));
      }).sort((a, b) => (a.display_name || '').localeCompare(b.display_name || ''));
    }

    function clPerfSetFilter(f) { _perfFilter = f; renderContent(); }
    function clPerfSearch(q) {
      _perfQuery = q;
      renderContent();
      const input = document.getElementById('cl-perf-search-input');
      if (input) { input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }

      return `

            <input type="search" id="cl-perf-search-input" placeholder="Search cast performers..." value="${esc(_perfQuery)}" oninput="clPerfSearch(this.value)" />
          </div>
          <div class="cl-perf-filters">

            <button class="cl-perf-filter-pill${_perfFilter==='assigned'?' active':''}" onclick="clPerfSetFilter('assigned')">Assigned</button>
            <button class="cl-perf-filter-pill${_perfFilter==='unassigned'?' active':''}" onclick="clPerfSetFilter('unassigned')">Needs a Role</button>
          </div>
          <div class="cl-perf-count">${visible.length} of ${_performerDirectory.length} cast performers</div>
        </div>
        <table class="cl-perf-table">
          <thead><tr>
            <th>Performer</th>
            <th>Email</th>
            <th>Role(s)</th>
            <th>Status</th>
            <th></th>

          <tbody>${rows}</tbody>

    }

    function detailItem(label, value, soft = false) {
      return `<div class="cl-detail-item">
        <div class="cl-detail-label">${esc(label)}</div>
        <div class="cl-detail-value${soft ? ' soft' : ''}">${esc(value)}</div>

    }

    function closePerformerCard(event) {
      if (event && event.target && event.target !== event.currentTarget) return;
      _selectedPerformerId = null;
      const modal = document.getElementById('cl-performer-modal');
      if (modal) modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    // Casting is progressive here - some characters aren't cast until weeks
    // into rehearsal, so this lets a producer add a role to an existing
    // performer straight from the Performers list instead of going back to
    // the Casting Board. Writes casting_assignments (source of truth) and
    // mirrors it into cast_members (what this page and costumes/portals/
    // script-breakdown all read from) the same way the SPA's
    // upsertCastMember()/finalCastingSetOfferAssignmentState() do.
    let _addRolePerformerId = null;
    function openAddRoleModal(performerId) {
      const record = _performerDirectory.find(r => String(r.id) === String(performerId));
      if (!record) return;
      _addRolePerformerId = performerId;
      document.getElementById('cl-add-role-error').classList.remove('visible');
      document.getElementById('cl-add-role-sub').textContent = `Assign ${record.display_name} to another character.`;
      const heldNames = new Set(record.roles.map(r => r.toLowerCase()));
      // Group by whether the role is already filled so an open ensemble slot
      // doesn't get buried under twenty already-cast principal roles - and
      // flag who's already in a role before double-casting it.
      const assigneesByChar = new Map();
      _castMembers.forEach(member => {
        if (!member.character_id || String(member.applicant_id) === String(record.applicant_id)) return;
        const answers = registrationAnswers(member);
        const name = displayNameForRecord(member, answers) || 'Unknown';
        const key = String(member.character_id);
        if (!assigneesByChar.has(key)) assigneesByChar.set(key, []);
        assigneesByChar.get(key).push(name);
      });
      const sortedChars = [..._chars].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      const openChars = sortedChars.filter(c => !assigneesByChar.has(String(c.id)));
      const filledChars = sortedChars.filter(c => assigneesByChar.has(String(c.id)));
      const optionHtml = c => {
        const held = heldNames.has(String(c.name || '').toLowerCase());
        const filledBy = assigneesByChar.get(String(c.id));
        const label = held ? `${c.name || ''} (already assigned to this performer)`
          : filledBy ? `${c.name || ''} — cast: ${filledBy.join(', ')}`
          : c.name || '';
        return `<option value="${esc(c.id)}"${held ? ' disabled' : ''}>${esc(label)}</option>`;
      };
      const select = document.getElementById('cl-add-role-character');
      select.innerHTML =
        (openChars.length ? `<optgroup label="Open roles">${openChars.map(optionHtml).join('')}</optgroup>` : '') +
        (filledChars.length ? `<optgroup label="Already cast">${filledChars.map(optionHtml).join('')}</optgroup>` : '');
      document.getElementById('cl-add-role-modal').classList.add('open');
    }
    function closeAddRoleModal(event) {
      if (event && event.target && event.target !== event.currentTarget) return;
      _addRolePerformerId = null;
      const modal = document.getElementById('cl-add-role-modal');
      if (modal) modal.classList.remove('open');
    }
    async function submitAddRole() {
      const record = _performerDirectory.find(r => String(r.id) === String(_addRolePerformerId));
      const errEl = document.getElementById('cl-add-role-error');
      errEl.classList.remove('visible');
      if (!record) return;
      const characterId = document.getElementById('cl-add-role-character').value;
      const state = 'offer_accepted'; // added directly here - no separate approval step needed
      const character = _chars.find(c => String(c.id) === String(characterId));
      if (!characterId || !character) {
        errEl.textContent = 'Choose a character.';
        errEl.classList.add('visible');
        return;
      }
      const saveBtn = document.getElementById('cl-add-role-save-btn');
      saveBtn.disabled = true;
      try {
        const { data: existingRows, error: findError } = await sb.from('casting_assignments')
          .select('id').eq('production_id', prodId).eq('applicant_id', record.applicant_id).eq('character_id', characterId).limit(1);
        if (findError) throw findError;
        if (existingRows && existingRows[0]) {
          await sb.from('casting_assignments').update({ state, dropped_out: false }).eq('id', existingRows[0].id);
        } else {
          await sb.from('casting_assignments').insert({ production_id: prodId, applicant_id: record.applicant_id, character_id: characterId, state });
        }
        await sb.from('cast_members').upsert({
          production_id: prodId,
          applicant_id: record.applicant_id,
          character_id: characterId,
          character_name: character.name || null,
          state,
          name: record.legal_name || record.display_name || null,
          preferred_name: record.display_name || null,
          pronouns: record.pronouns || null,
          date_of_birth: record.date_of_birth || null,
          email: record.email || null,
          phone: record.phone || null,
          guardian_name: record.guardian_name || null,
          guardian_email: record.guardian_email || null,
          guardian_phone: record.guardian_phone || null,
          headshot_url: record.headshot_url || null,
          registration_answers: record.answers || {},
          updated_at: new Date().toISOString(),
        }, { onConflict: 'production_id,applicant_id,character_id' });
        closeAddRoleModal();
        await loadCastListData();
      } catch (err) {
        errEl.textContent = err.message || 'Could not save this role.';
        errEl.classList.add('visible');
      } finally {
        saveBtn.disabled = false;
      }
    }

    // Shared, filesystem-safe base name so both CSV and PDF exports are
    // actually labelled with the show and the date they were exported,
    // instead of a bare generic "cast-list".
    function exportFileLabel() {
      const showSlug = String(_prodTitle || 'Production').trim().replace(/'/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'Production';
      const dateSlug = new Date().toISOString().slice(0, 10);
      return showSlug + '_Cast-List_' + dateSlug;
    }

    function exportCSV() {
      const sorted = [..._chars].sort((a, b) => sortRank(a) - sortRank(b) || (a.name||'').localeCompare(b.name||''));
      const rows = [['Character / Role', 'Performer(s)', 'Role Type', 'Status']];
      sorted.forEach(c => {
        const assigned = getAssigned(c.id);
        const names = assigned.length ? assigned.map(e => e.perf.name || '').join('; ') : 'Open';
        const status = assigned.length ? assigned[0].state : 'open';
        rows.push([c.name || '', names, c.role_type || '', status]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = exportFileLabel() + '.csv';
      a.click();
    }

    // Opens a print-formatted window and triggers the browser's print dialog,
    // same pattern as cast-checkin.html's attendance sheet - "Save as PDF" is
    // a built-in browser print destination, no PDF library needed.
    function exportPDF() {
      const byName = (a, b) => (a.name||'').localeCompare(b.name||'');
      const named = _chars.filter(c => !isEnsemble(c)).sort(byName);
      const ensemble = _chars.filter(c => isEnsemble(c)).sort(byName);
      // Every performer name on a separate line under a multi-cast role (like
      // the on-screen Ensemble list) counts as its own visual line, so a
      // one-page fit has to account for those, not just one row per character.
      function lineCount(chars) {
        return chars.reduce((sum, c) => {
          const n = getAssigned(c.id).length;
          return sum + Math.max(1, n);
        }, chars.length);
      }
      const totalLines = lineCount(named) + lineCount(ensemble);
      // Tiered shrink so a big cast still lands on one 8.5x11 page instead of
      // spilling to a second - tuned against real cast lists during testing.
      let rowPad = '6px 10px', nameFs = '12px', roleFs = '12px';
      if (totalLines > 70) { rowPad = '2.5px 10px'; nameFs = '9px'; roleFs = '9px'; }
      else if (totalLines > 50) { rowPad = '3.5px 10px'; nameFs = '10px'; roleFs = '10px'; }
      else if (totalLines > 32) { rowPad = '4.5px 10px'; nameFs = '11px'; roleFs = '11px'; }

      function rowsHtml(chars) {
        return chars.map(c => {
          const assigned = getAssigned(c.id);
          const names = assigned.length ? assigned.map(e => esc(e.perf.name || 'Unknown')).join('<br>') : '<span style="color:#999;font-style:italic;">Open</span>';
          return '<div class="row"><div class="role">' + esc(c.name || '') + '</div><div class="perf">' + names + '</div></div>';
        }).join('');
      }

      const printTitle = (_prodTitle || 'Cast List') + ' - Cast List - ' + new Date().toISOString().slice(0, 10);
      const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + esc(printTitle) + '</title>' +
        '<style>' +
          '@page{size:letter;margin:0.5in;}' +
          '*{box-sizing:border-box;}' +
          'body{font-family:Arial,Helvetica,sans-serif;color:#000;margin:0;padding:0;}' +
          'h1{margin:0 0 12px;font-size:22px;font-weight:900;text-align:center;}' +
          '.col-heads{display:flex;font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8c8c94;padding:0 0 3px;}' +
          '.col-heads .role{flex:1;text-align:right;padding-right:14px;}.col-heads .perf{flex:1;text-align:left;padding-left:14px;}' +
          '.row{display:flex;padding:' + rowPad + ';}' +
          '.row .role{flex:1;font-weight:800;font-size:' + nameFs + ';color:#000;text-align:right;padding-right:14px;}' +
          '.row .perf{flex:1;font-size:' + roleFs + ';color:#222;line-height:1.35;text-align:left;padding-left:14px;}' +
          '@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}' +
        '</style></head><body>' +
        '<h1>Cast List</h1>' +
        '<div class="col-heads"><span class="role">Character / Role</span><span class="perf">Performer(s)</span></div>' +
        rowsHtml([...named, ...ensemble]) +
        '<script>window.onload=function(){window.print();}<\/script></body></html>';

      const win = window.open('', '_blank');
      if (!win) { alert('Please allow pop-ups to export a PDF.'); return; }
      win.document.write(html);
      win.document.close();
    }

          date_conflicts: member.date_conflicts || app?.date_conflicts || null,
        };

      const apps = appRes.data || [];
      const bookIds = new Set(apps.map(a => String(a.id)));
      _performers = [

        ...(bookRes.data || []).filter(b => !bookIds.has(String(b.id))),
      ];

      if (!document.getElementById('cl-content')) {

            <button class="view-btn active" onclick="switchView('programme',this)">Programme</button>
            <button class="view-btn" onclick="switchView('table',this)">Performers</button>
          </div>
          <div id="cl-content"></div>`;
      }

      renderContent();
    }
    loadCastListData();
  </script>
