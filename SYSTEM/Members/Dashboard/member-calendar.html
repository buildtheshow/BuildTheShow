<!doctype html>
<html lang="en-CA"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Calendar | Build The Show</title>
<link rel="stylesheet" href="/ASSETS/styles/styles.css?v=20260815-focus-fix"><link rel="stylesheet" href="/ASSETS/styles/member-sidebar.css?v=brand-sweep-20260728"><link rel="stylesheet" href="/ASSETS/styles/member-calendar.css?v=20261122-approved-calendar">
<script src="/SHARED/Components/account-security.js?v=20261117-canonical-urls"></script><script defer src="/ASSETS/scripts/member-sidebar.js?v=20261125-my-circle-icon"></script><script defer src="/ASSETS/vendor/fullcalendar-6.1.15.global.min.js"></script></head>
<body class="member-calendar"><div id="member-calendar-page" class="dashboard-layout">
<button type="button" id="calendar-nav-shade" class="calendar-nav-shade" aria-label="Close navigation" hidden></button>
<aside class="sidebar" aria-label="Main navigation" id="calendar-sidebar">

      <button type="button" id="calendar-nav-close" class="calendar-nav-close" aria-label="Close navigation">×</button><div class="sidebar-logo">
        <a href="/">
          <img src="/ASSETS/Images/LogoBrand/logo-long-white.png" alt="Build The Show" />
        </a>
      </div>

      <!-- Profile switcher -->
      <a href="/member/profiles" class="sidebar-profile-switcher" id="sidebar-profile-switcher" aria-label="Switch profile">
        <div class="sidebar-profile-avatar-placeholder" id="sidebar-avatar-placeholder"><img src="/ASSETS/Images/Icons/performer2.svg" alt="" style="width:30px;height:30px;object-fit:contain"></div>
        <div class="sidebar-profile-switcher-info">
          <div class="sidebar-profile-switcher-name" id="sidebar-profile-name">My Profile</div>
          <div class="sidebar-profile-switcher-hint">Member · Switch profile</div>
        </div>
        <span class="sidebar-profile-switcher-chevron">▾</span>
      </a>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main">
        <!-- Populated by member-sidebar.js -->
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-email" id="sidebar-email"></div>
        <button class="sidebar-logout" id="home-logout">
          <svg width="14" height="14" aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3M10 11l4-4-4-4M14 8H6"/>
          </svg>
          Log Out
        </button>
      </div>

    </aside><main class="dashboard-main">
<header class="ac-top"><button type="button" class="calendar-nav-open" id="calendar-nav-open" aria-label="Open navigation" aria-expanded="false" aria-controls="calendar-sidebar">☰</button><h1>My Calendar</h1><div class="ac-views" role="group" aria-label="Calendar view"><button type="button" data-view="timeGridDay" aria-pressed="false">Day</button><button type="button" data-view="timeGridWeek" aria-pressed="false">Week</button><button type="button" data-view="dayGridMonth" aria-pressed="true">Month</button><button type="button" data-view="listMonth" aria-pressed="false">List</button></div></header>
<section id="activity-scope-picker" class="ac-people" aria-label="Choose a profile or circle"><div id="activity-profile-options"></div><div id="activity-circle-options"></div><p id="activity-selection-status" class="sr-only" role="status"></p></section>
<div class="ac-period"><h2 id="ac-date-label"></h2><div class="ac-move"><button type="button" class="ac-arrow" id="ac-prev" aria-label="Previous calendar period">‹</button><button type="button" id="ac-today">Today</button><button type="button" class="ac-arrow" id="ac-next" aria-label="Next calendar period">›</button></div></div>
<div id="ac-grid"></div>
<section class="ac-agenda" aria-labelledby="ac-agenda-title"><h2 id="ac-agenda-title"></h2><div id="ac-agenda-list" aria-live="polite"></div></section>
<div class="ac-legend" aria-label="Event colours" id="ac-legend"></div>
<p id="calendar-status" class="calendar-status" role="status">Loading your calendar…</p><button type="button" id="calendar-retry" class="member-action" hidden>Try again</button><p id="activity-media-note" class="calendar-status" hidden>Some photos or role details could not load. <a href="">Try loading again</a>.</p>
</main><dialog class="ac-event-dialog" id="ac-detail" aria-labelledby="ac-detail-title"><button type="button" class="ac-close" id="ac-close" aria-label="Close event details">×</button><div class="ac-detail-type"><span class="ac-dot" id="ac-detail-dot"></span><span id="ac-detail-type"></span></div><h2 id="ac-detail-title"></h2><p id="ac-detail-date"></p><p id="ac-detail-time"></p><div id="calendar-detail-members"></div><p id="ac-detail-venue"></p><div class="ac-detail-notes"><p><strong>Arrival</strong><br><span id="ac-detail-arrival"></span></p><p><strong>Bring</strong><br><span id="ac-detail-bring"></span></p><p><strong>Before you arrive</strong><br><span id="calendar-detail-prepare"></span></p></div><p><a id="calendar-production-link" href="/member/activities">View production details →</a></p></dialog>
</div><script type="module" src="/ASSETS/scripts/account/calendar.js?v=20261122-approved-calendar"></script></body></html>
