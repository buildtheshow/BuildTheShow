<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm Your Account - Build The Show</title>
  <link rel="stylesheet" href="/ASSETS/styles/styles.css?v=20260815-focus-fix" />
  <link rel="stylesheet" href="/ASSETS/styles/account-forms.css?v=20261117-account-forms" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/SYSTEM/config.js"></script>
  <script src="/SHARED/Components/account-security.js?v=20261116-one-account"></script>
</head>
<body>
<div class="grid-bg"></div>
<header class="nav">
  <div class="nav-logo"><a href="/"><img src="/ASSETS/Images/LogoBrand/logo-long-white.png" alt="Build The Show" class="nav-logo-img" /></a></div>
</header>
<main class="auth-main"><div class="auth-card">
  <h1 class="auth-card-title">Confirm your details</h1>
  <p class="auth-card-subtitle">One quick check before you continue. Logins are for people aged 18 or over.</p>
  <p class="auth-copy">Adding a child? Enter your own details here. You can set up their profile afterwards.</p>
  <p class="auth-note">Your birth date stays private.</p>
  <div id="account-message" class="auth-message" role="status" aria-live="polite">Checking your account...</div>
  <form id="confirm-form" hidden>
    <div class="form-group">
      <label class="form-label" for="account-dob">Your date of birth</label>
      <input class="form-input" id="account-dob" type="date" autocomplete="bday" required />
    </div>
    <label class="consent-label"><input id="confirm-privacy" type="checkbox" required /><span>I have read the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>
    <label class="consent-label"><input id="confirm-terms" type="checkbox" required /><span>I agree to the <a href="/terms" target="_blank" rel="noopener">Terms of Service</a>.</span></label>
    <button class="btn--primary" id="confirm-submit" type="submit">Confirm and continue</button>
  </form>
  <div class="auth-footer"><p>Need a hand? <a href="mailto:privacy@buildtheshow.com">Get in touch</a>.</p><button class="auth-text-button" id="sign-out" type="button">Sign Out</button></div>
</div></main>
<script>
  const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const message = document.getElementById('account-message');
  const form = document.getElementById('confirm-form');
  const next = BTSAccountSecurity.safeReturnPath(new URLSearchParams(location.search).get('return'));
  async function init() {
    const { data: { user }, error } = await client.auth.getUser();
    if (error || !user) { location.replace('/login?return=' + encodeURIComponent(next)); return; }
    const { data, error: statusError } = await client.rpc('bts_get_account_status');
    if (statusError || !data) { message.textContent = 'We could not check your account. Please try again or contact us.'; return; }
    if (!data.email_verified) { message.textContent = 'Open the link in your sign-up email, then log in again. Not there? Check your junk or spam folder.'; return; }
    if (data.active) { location.replace(next); return; }
    if (data.status === 'underage' || data.status === 'closed') {
      message.textContent = data.status === 'closed' ? 'This account is closed. Get in touch if you need help with existing profiles.' : 'A parent or legal guardian needs to use their own account. Get in touch if you need help with existing profiles.';
      return;
    }
    message.textContent = '';
    form.hidden = false;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const birthDate = document.getElementById('account-dob').value;
    if (!BTSAccountSecurity.validAdultBirthDate(birthDate)) { message.textContent = 'Enter your own birth date. You need to be 18 or over to continue.'; return; }
    const button = document.getElementById('confirm-submit'); button.disabled = true;
    try {
      const { error } = await client.rpc('bts_confirm_adult_account', {
        p_birth_date: birthDate,
        p_privacy_accepted: document.getElementById('confirm-privacy').checked,
        p_terms_accepted: document.getElementById('confirm-terms').checked,
      });
      if (error) throw error;
      location.replace(next);
    } catch (error) { message.textContent = 'We could not save your details. Try again. Your entries are still here.'; }
    finally { button.disabled = false; }
  });
  document.getElementById('sign-out').addEventListener('click', async () => { await client.auth.signOut(); location.replace('/'); });
  init().catch(() => { message.textContent = 'We could not check your account. Please try again.'; });
</script>
<script defer src="/SHARED/Components/legal-footer.js"></script>
</body>
</html>
