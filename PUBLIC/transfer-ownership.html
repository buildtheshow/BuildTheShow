<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Accept Organisation Ownership - Build The Show</title>
  <link rel="stylesheet" href="/ASSETS/styles/styles.css?v=20260815-focus-fix" />
  <style>
    body { margin:0; background:#fff; color:#000; font-family:var(--bts-font); }
    main { max-width:560px; margin:3rem auto; padding:1.5rem; } p { line-height:1.6; }
    label { display:flex; align-items:flex-start; gap:.7rem; margin:1.5rem 0; line-height:1.6; }
    button { padding:.9rem 1.2rem; border:0; border-radius:8px; background:#572e88; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; } a { color:#572e88; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/SYSTEM/config.js"></script>
  <script src="/SHARED/Components/account-security.js?v=20261116-one-account"></script>
</head>
<body>
<main>
  <a href="/">Build The Show</a>
  <h1>Organisation ownership</h1>
  <p id="transfer-status" role="status" aria-live="polite">Checking the ownership invitation…</p>
  <form id="transfer-form" hidden>
    <p>As owner, you will be responsible for this organisation’s account and who can administer it. The previous owner will remain an organisation admin. Your own personal account and profiles remain separate.</p>
    <label><input type="checkbox" id="accept-responsibility" required /><span>I understand and accept responsibility as this organisation’s owner.</span></label>
    <button id="accept-transfer" type="submit">Accept ownership</button>
  </form>
</main>
<script>
  const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const token = new URLSearchParams(location.search).get('token') || '';
  const status = document.getElementById('transfer-status');
  const form = document.getElementById('transfer-form');
  async function init() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) { location.replace('/login?return=' + encodeURIComponent(location.pathname + location.search)); return; }
    if (!await BTSAccountSecurity.ensureAdultAccount(client)) return;
    const { data, error } = await client.rpc('bts_preview_ownership_transfer', { p_token: token });
    if (error || !data) { status.textContent = 'This ownership invitation is unavailable, expired, or belongs to another account.'; return; }
    status.textContent = 'Organisation: ' + data.organisation_name;
    if (data.can_accept) form.hidden = false;
    else status.textContent += '. The intended recipient must sign in with their own account to accept.';
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = document.getElementById('accept-transfer'); button.disabled = true;
    try {
      const { data, error } = await client.rpc('bts_accept_ownership_transfer', { p_token: token });
      if (error) throw error;
      form.hidden = true;
      status.textContent = 'Ownership accepted. You can now open the organisation dashboard.';
      const link = document.createElement('a');
      link.href = data.slug ? '/' + encodeURIComponent(data.slug) + '/ORG' : '/org/dashboard';
      link.textContent = 'Open organisation dashboard';
      status.after(link);
    } catch (error) { status.textContent = error.message || 'We could not accept ownership. Please try again.'; }
    finally { button.disabled = false; }
  });
  init().catch(() => { status.textContent = 'We could not check this ownership invitation. Please try again.'; });
</script>
<script defer src="/SHARED/Components/legal-footer.js"></script>
</body>
</html>
