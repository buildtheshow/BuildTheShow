<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Accept Organisation Ownership - Build The Show</title>
  <link rel="stylesheet" href="/ASSETS/styles/styles.css?v=20260815-focus-fix" />
  <link rel="stylesheet" href="/ASSETS/styles/account-forms.css?v=20261117-account-forms" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/SYSTEM/config.js"></script>
  <script src="/SHARED/Components/account-security.js?v=20261117-canonical-urls"></script>
</head>
<body>
<div class="grid-bg"></div>
<header class="nav">
  <div class="nav-logo"><a href="/"><img src="/ASSETS/Images/LogoBrand/logo-long-white.png" alt="Build The Show" class="nav-logo-img" /></a></div>
</header>
<main class="auth-main"><div class="auth-card">
  <h1 class="auth-card-title">Organisation ownership</h1>
  <p class="auth-card-subtitle">Taking over? Check the organisation below before you accept.</p>
  <p id="transfer-status" class="auth-message" role="status" aria-live="polite">Checking the invitation...</p>
  <form id="transfer-form" hidden>
    <p class="auth-copy">You’ll become the owner and decide who can manage this organisation. The previous owner will stay as an admin. Your personal profile stays separate.</p>
    <label class="consent-label"><input type="checkbox" id="accept-responsibility" required /><span>I understand and accept responsibility as this organisation’s owner.</span></label>
    <button class="btn--primary" id="accept-transfer" type="submit">Accept ownership</button>
  </form>
  <div class="auth-footer"><a href="/member/home">Back to My Home</a></div>
</div></main>
<script>
  const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const token = new URLSearchParams(location.search).get('token') || '';
  const status = document.getElementById('transfer-status');
  const form = document.getElementById('transfer-form');
  async function init() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) { location.replace('/login?return=' + encodeURIComponent(location.pathname + location.search)); return; }
    if (!await BTSAccountSecurity.ensureAdultAccount(client)) return;
    const { data, error } = await client.rpc('bts_preview_ownership_transfer', { p_token: token });
    if (error || !data) { status.textContent = 'This invitation has expired or cannot be opened with this login. Ask the current owner for a new link.'; return; }
    status.textContent = 'Organisation: ' + data.organisation_name;
    if (data.can_accept) form.hidden = false;
    else status.textContent += '. Log in with the account the invitation was sent to.';
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = document.getElementById('accept-transfer'); button.disabled = true;
    try {
      const { data, error } = await client.rpc('bts_accept_ownership_transfer', { p_token: token });
      if (error) throw error;
      form.hidden = true;
      status.textContent = 'You’re now the owner. Your organisation is ready to open.';
      const link = document.createElement('a');
      link.href = '/org';
      link.className = 'btn--primary';
      link.textContent = 'Open organisation';
      status.after(link);
    } catch (error) { status.textContent = 'We could not confirm the handover. Please check the organisation before trying again.'; }
    finally { button.disabled = false; }
  });
  init().catch(() => { status.textContent = 'We could not check this ownership invitation. Please try again.'; });
</script>
<script defer src="/SHARED/Components/legal-footer.js"></script>
</body>
</html>
